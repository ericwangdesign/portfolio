<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon-darkbg.png" />
  <link rel="apple-touch-icon" href="/favicon-darkbg.png" />
  <title>Cities, roughly</title>
  <style>
    /* One type size, one dim ink, and three spacing steps that have to stay in
       ratio: a label sits tight to its control (4), wrapped rows of that control
       breathe wider (11), and separate fields wider still (30). When the first two
       were equal, a label read as just another row and nothing grouped.
       Nothing is tracked out — at this size letter-spacing only makes short
       lowercase words look stretched. */
    :root {
      --paper: #06060c;
      --ink: #ece9e2;
      --faint: #ece9e233;
      --dim: #ece9e299;
      --aspect: 1.1894;
      --gap-label: 4px;
      --gap-row: 11px;
      --gap-field: 30px;
      --gap-block: 38px;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      line-height: 1.5;
      letter-spacing: normal;
      -webkit-font-smoothing: antialiased;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ---- canvas ----------------------------------------------------------- */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      min-width: 0;
    }
    /* The column is at least wide enough for the transport, so a tall narrow city
       (Manhattan) doesn't drag the clock and scrubber into a sliver with it. */
    .canvas-col {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
      width: min(100%, max(420px, calc(78vh * var(--aspect))));
      max-height: 100%;
    }
    .stage { position: relative; width: min(100%, calc(78vh * var(--aspect))); }
    .stage::before { content: ""; display: block; padding-top: calc(100% / var(--aspect)); }
    .stage canvas {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
      transition: opacity 200ms ease;
    }
    .stage.loading canvas { opacity: 0.25; }

    .transport { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 16px; }
    .clock { display: flex; align-items: baseline; justify-content: center; gap: 10px; }
    .clock .time { font-size: 24px; font-weight: 300; font-variant-numeric: tabular-nums; }
    .clock .phase { color: var(--dim); }
    .playrow { display: flex; align-items: center; gap: 16px; }
    .playrow button {
      font: inherit; width: 30px; height: 24px; flex: none;
      background: none; border: 1px solid var(--faint); color: var(--ink); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 140ms ease;
    }
    .playrow button:hover { border-color: var(--ink); }
    .playrow input[type="range"] { flex: 1; }

    input[type="range"] {
      display: block; width: 100%; appearance: none; height: 1px; outline: none;
      background: linear-gradient(to right, var(--ink) 0 var(--fill, 0%), var(--faint) var(--fill, 0%) 100%);
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none; width: 11px; height: 11px; border-radius: 50%;
      background: var(--ink); cursor: pointer; border: none;
    }
    input[type="range"]::-moz-range-thumb {
      width: 11px; height: 11px; border-radius: 50%; background: var(--ink);
      cursor: pointer; border: none;
    }
    input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--faint); }
    button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

    /* ---- sidebar ---------------------------------------------------------- */
    aside {
      width: 316px;
      padding: 40px 34px 36px 30px;
      display: flex;
      flex-direction: column;
      gap: var(--gap-block);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--faint) transparent;
    }
    .masthead .kicker { color: var(--dim); line-height: 1.3; margin-bottom: 7px; }
    .masthead h1 { font-size: 15px; font-weight: 500; line-height: 1.3; }
    .masthead .sub { color: var(--dim); line-height: 1.45; margin-top: 13px; }

    .fields { display: flex; flex-direction: column; gap: var(--gap-field); }
    .field { display: flex; flex-direction: column; gap: var(--gap-label); }
    .field > .name { color: var(--dim); line-height: 1.3; }

    .seg { display: flex; flex-wrap: wrap; gap: var(--gap-row) 16px; line-height: 1.3; }
    .seg button {
      font: inherit; padding: 0; background: none; border: none;
      color: var(--dim); cursor: pointer; transition: color 140ms ease;
    }
    .seg button:hover { color: var(--ink); }
    .seg button.active { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
    .seg button[disabled] { opacity: 0.35; cursor: default; }
    .seg button[disabled]:hover { color: var(--dim); }

    /* two columns, so the four keys read as a deliberate block rather than a 3+1 wrap */
    .legend { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-row) 12px; color: var(--dim); line-height: 1.3; }
    .legend span { display: flex; align-items: center; gap: 7px; }
    .legend i { width: 8px; height: 8px; display: inline-block; flex: none; }

    footer { color: var(--dim); opacity: 0.7; font-size: 11px; line-height: 1.7; margin-top: auto; padding-top: var(--gap-block); }
    footer p + p { margin-top: 10px; }

    @media (max-width: 860px) {
      body { flex-direction: column; height: auto; min-height: 100dvh; overflow: auto; }
      main { padding: 20px 20px 4px; }
      .canvas-col { width: 100%; gap: 20px; }
      .transport { max-width: none; }
      aside { width: 100%; padding: 26px 20px 44px; gap: 30px; }
      footer { margin-top: 12px; }
    }
    @media (pointer: coarse) {
      input[type="range"] { height: 2px; }
      input[type="range"]::-webkit-slider-thumb { width: 20px; height: 20px; }
      input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; }
      .seg { gap: 14px 18px; }
    }
  </style>
  <script type="module" crossorigin src="/cities/assets/index-xLaRrjqk.js"></script>
</head>
<body>
  <main>
    <div class="canvas-col">
      <div class="stage" id="stage">
        <canvas id="live"></canvas>
      </div>
      <div class="transport">
        <div class="clock">
          <span class="time" id="clock-time">00:00</span>
          <span class="phase" id="clock-phase">deep night</span>
        </div>
        <div class="playrow">
          <button id="play" aria-label="Play"><svg width="9" height="11" viewBox="0 0 9 11" aria-hidden="true"><path d="M0 0 L9 5.5 L0 11 Z" fill="currentColor"/></svg></button>
          <input type="range" id="hour" min="0" max="1440" step="1" value="480" aria-label="Hour of day" />
        </div>
      </div>
    </div>
  </main>

  <aside>
    <div class="masthead">
      <p class="kicker">Experiment</p>
      <h1>Cities, roughly</h1>
      <p class="sub">A map of where people are across one day, drawn as dither. Six cities, looping through the week.</p>
    </div>

    <div class="fields">
      <div class="field">
        <span class="name">city</span>
        <div class="seg" id="cities"></div>
      </div>
      <div class="field">
        <span class="name">shape</span>
        <div class="seg" id="marks">
          <button data-style="0" class="active">dots</button>
          <button data-style="1">ascii</button>
          <button data-style="2">letters</button>
          <button data-style="3">halftone</button>
          <button data-style="4">braille</button>
        </div>
      </div>
      <div class="field">
        <span class="name">photo</span>
        <div class="seg" id="photo-toggle">
          <button data-photo="0" class="active">off</button>
          <button data-photo="1">on</button>
        </div>
      </div>
    </div>

    <div class="legend" id="legend"></div>

    <footer>
      <p id="sources"></p>
      <p>© 2026 Eric Wang</p>
    </footer>
  </aside>
</body>
</html>
