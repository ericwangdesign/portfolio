<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pen &amp; Paper</title>
<meta name="description" content="A typing surface where letterforms record the process of writing — hesitation, speed, deletions — as ink on paper.">
<meta property="og:title" content="Pen &amp; Paper">
<meta property="og:description" content="We digitized the words and lost the writing.">
<meta property="og:image" content="/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/favicon-lightbg.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=La+Belle+Aurore&family=Caveat:wght@400..700&family=Nanum+Pen+Script&family=Shantell+Sans:ital,wght@0,300..800;1,300..800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f1e8;
    --graphite:#6b6560;
    --ink:#1c1a17;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    overflow-y:auto;
    overflow-x:hidden;
    cursor:text;
    -webkit-font-smoothing:antialiased;
  }
  /* paper grain */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    z-index:0;
    opacity:.055;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
    background-size:240px 240px;
  }
  /* a barely-there warmth gradient so the paper isn't dead flat */
  body::after{
    content:"";
    position:fixed; inset:0;
    pointer-events:none; z-index:0;
    background:radial-gradient(120% 90% at 50% 0%, rgba(255,253,247,.55), rgba(233,226,212,.35) 70%, rgba(224,216,200,.5) 100%);
  }

  #stage{position:relative; z-index:1; width:100%;}
  #page{
    position:relative;
    width:640px;
    margin:0 auto;
    min-height:100vh;
  }
  #glyphs{position:absolute; inset:0;}
  #strikes{position:absolute; left:0; top:0; overflow:visible; pointer-events:none;}
  .g{
    position:absolute;
    line-height:1;
    white-space:pre;
    transform-origin:50% 100%;
    user-select:none;
    cursor:text;
    /* NO will-change here. It promotes every glyph to its own composited
       layer, and the layer is rasterized to the element's box — but these
       hands draw far outside theirs (line-height:1, ascenders and flourishes
       climbing well past the em box), so promotion shears the tops off every
       tall letter. Transforms here are static per glyph, not animated, so the
       hint bought nothing; dropping it also avoids a layer per character. */
  }
  .g.click{cursor:pointer}
  .gi{ }
  /* NO masks and NO filters anywhere on glyphs. Both rasterize the element
     into its own layer sized to the element's box, and these hands draw far
     outside their box — every mask/filter variant we tried ended up shearing
     ascenders at some size or during some frame of animation. The entrance
     is a plain opacity fade: quick enough to read as the ink landing, with
     nothing that can clip. */
  @keyframes penstroke{
    0%  { opacity:0; }
    100%{ opacity:1; }
  }
  .gi.reveal{
    animation:penstroke var(--rd,140ms) ease-out backwards;
  }
  @media (prefers-reduced-motion:reduce){
    .gi.reveal{ animation:none; }
  }
  .blot{
    position:absolute;
    pointer-events:none;
    border-radius:50%;
    transform:translate(-50%,-50%);
  }
  .selunder{
    position:absolute;
    height:1px;
    background:var(--graphite);
    opacity:.55;
    pointer-events:none;
  }
  #caret{
    position:absolute;
    width:1.5px;
    background:var(--ink);
    opacity:.85;
    pointer-events:none;
    animation:blink 1.1s steps(1,end) infinite;
  }
  @keyframes blink{0%,55%{opacity:.85}56%,100%{opacity:0}}
  #placeholder{
    position:absolute;
    color:var(--graphite);
    opacity:.30;
    pointer-events:none;
    line-height:1;
    white-space:pre;
    transition:opacity .5s ease;
  }
  #caption{
    position:absolute;
    left:0; width:100%;
    text-align:center;
    color:var(--graphite);
    opacity:0;
    transition:opacity 1.4s ease;
    pointer-events:none;
    line-height:1.5;
  }
  #caption.show{opacity:.5}
  #caption .d{font-size:.62em; opacity:.75}

  #hidden{
    position:fixed; left:-9999px; top:0; width:1px; height:1px;
    opacity:0; border:0; padding:0; resize:none;
  }

  /* ---------- voice ---------- */
  #mic{
    position:fixed; left:26px; bottom:22px; z-index:40;
    color:var(--graphite); opacity:.32;
    line-height:1;
    cursor:pointer; user-select:none;
    transition:opacity .35s ease, color .35s ease;
    display:flex; align-items:center; gap:9px;
  }
  #mic:hover{opacity:.55}
  #mic.on{color:var(--ink); opacity:.85}
  #mic .dot{
    width:7px; height:7px; border-radius:50%;
    background:currentColor; opacity:0;
    transition:opacity .3s ease;
  }
  #mic.on .dot{opacity:.8; animation:micpulse 1.6s ease-in-out infinite}
  @keyframes micpulse{0%,100%{transform:scale(.7);opacity:.45}50%{transform:scale(1);opacity:.9}}
  #mic.err{opacity:.2; cursor:default}

  /* ---------- control panel ---------- */
  #panel{
    position:fixed; right:22px; top:22px; z-index:50;
    width:268px;
    background:rgba(247,244,236,.93);
    backdrop-filter:blur(8px);
    border:1px solid rgba(107,101,96,.22);
    border-radius:3px;
    box-shadow:0 6px 26px rgba(60,54,44,.10);
    padding:14px 14px 12px;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    font-size:10.5px;
    color:#4b4640;
    display:none;
    max-height:calc(100vh - 44px);
    overflow-y:auto;
    cursor:default;
  }
  #panel.on{display:block}
  #panel h4{
    margin:0 0 10px; font-size:9px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; color:#8d867d;
  }
  #panel .hint{font-size:9px;color:#9a938a;margin:-6px 0 12px;letter-spacing:.02em}
  #panel .row{margin-bottom:9px}
  #panel label{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px; letter-spacing:.01em}
  #panel .val{color:#8d867d; font-variant-numeric:tabular-nums; font-size:9.5px}
  #panel select{
    width:100%; font-family:inherit; font-size:10.5px; padding:4px 5px;
    background:rgba(255,255,255,.6); color:#3d3934;
    border:1px solid rgba(107,101,96,.25); border-radius:2px; outline:none;
  }
  #panel input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:14px; background:transparent; outline:none; margin:0;
  }
  #panel input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(107,101,96,.35)}
  #panel input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:9px;height:9px;border-radius:50%;
    background:#5c564f; margin-top:-4px; cursor:pointer;
  }
  #panel input[type=range]::-moz-range-track{height:1px;background:rgba(107,101,96,.35)}
  #panel input[type=range]::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:#5c564f;cursor:pointer}
  #panel .tog{display:flex;justify-content:flex-start;align-items:center;gap:7px;margin-bottom:7px;cursor:pointer;user-select:none}
  #panel .tog input{accent-color:#5c564f;margin:0;cursor:pointer}
  #panel .sep{height:1px;background:rgba(107,101,96,.16);margin:12px 0 11px}
  #panel .btns{display:flex;gap:6px;flex-wrap:wrap}
  #panel button{
    flex:1 1 auto; font-family:inherit; font-size:10px; letter-spacing:.02em;
    padding:6px 8px; background:rgba(255,255,255,.5); color:#4b4640;
    border:1px solid rgba(107,101,96,.28); border-radius:2px; cursor:pointer;
    transition:background .15s;
  }
  #panel button:hover{background:rgba(255,255,255,.9)}
  #panel button:disabled{opacity:.4;cursor:default}
</style>

</head>
<body>
<div id="stage">
  <div id="page">
    <svg id="strikes" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="glyphs"></div>
    <div id="placeholder">start writing</div>
    <div id="caret"></div>
    <div id="caption"></div>
  </div>
</div>
<textarea id="hidden" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>

<div id="mic" title="dictate onto the page"><span class="dot"></span><span class="lbl">listen</span></div>

<div id="panel">
  <h4>Pen &amp; Paper</h4>
  <div class="hint">⌘/ (ctrl /) toggles this panel · esc cancels a revision</div>
  <div id="controls"></div>
  <div class="sep"></div>
  <div class="btns">
    <button id="btnReplay">Replay</button>
    <button id="btnSave">Save page</button>
    <button id="btnClear">Clear</button>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   PEN & PAPER
   A typing surface where letterforms record the process of writing.

   Three layers, one code path:
     Timeline  — the raw record of what happened (events + timestamps)
     Layout    — (timeline + settings) -> positioned, styled glyphs
     Renderer  — glyphs -> DOM (and, for export, -> canvas)

   Replay, font switching, resizing and slider changes ALL just re-run
   Layout + Render over the timeline. Nothing is stored in the DOM.
   ========================================================================= */

/* ------------------------------ constants ------------------------------ */

const GRAPHITE = [0x6b, 0x65, 0x60];
const INK      = [0x1c, 0x1a, 0x17];
const COL_W    = 640;          // writing column width
const PAD_TOP  = 132;          // top of page padding
const PAD_BOT  = 180;
const FAST_MS  = 70;           // dt considered "fast"
const SLOW_MS  = 620;          // dt considered "deliberate"
const DT_CAP   = 1400;         // dt above this doesn't loosen the hand further
// The hand stays PERFECTLY regular until the pen is genuinely moving, then
// breaks down fast. SCRAP_KNEE is that threshold on the 0..1 pace scale:
// 0.62 lands at roughly 160ms/char, so deliberate and ordinary typing both
// render dead-straight and even, and only a real burst goes messy. Below the
// knee scrap is exactly 0 — not merely small — which is what makes the slow
// end read as 规整 rather than slightly-wobbly.
const SCRAP_KNEE  = 0.62;
const STRIKE_OP = 1;           // the strike is a mark of its own, not a ghost — full ink
const IDLE_CAP = 10000;        // ms of stillness before the caption fades in
const REPLAY_GAP_CAP = 3000;

/* Each Hand is a single typeface — one connected cursive letterform, never a
   print/cursive pair. A slow, careful pass doesn't switch faces; it lifts
   the pen between letters and tapers the same cursive's baked-in connector
   strokes out at each glyph's edges (the "lifted-pen" mask, see g.fadeEm
   below and glyphStyle()). A fast pass releases that taper continuously
   until the connectors join up naturally. No thresholds, no discrete states.

   `scale` is each face's own size multiplier against the Size slider, so
   switching hands doesn't jump in apparent x-height or stroke weight.

   `join` is the tracking, in em, at which the face's letters just touch —
   the exit stroke of one letter meeting the entry stroke of the next. It is
   the FLOOR of the tracking range the fast end of the speed axis walks down
   to (see SPREAD_CAP). Connected faces want a whisker of negative (letters
   actually overlap/join); faces with looser connectors rest at a small
   positive distance instead. */
const FONTS = [
  { id:'Homemade Apple',   label:'Homemade Apple',   scale:0.86, join:-0.030 },
  { id:'La Belle Aurore',  label:'La Belle Aurore',  scale:1.06, join:-0.035 },
  { id:'Caveat',           label:'Caveat',           scale:1.28, join:-0.015 },
  { id:'Nanum Pen Script', label:'Nanum Pen Script', scale:1.30, join: 0.000 },
  { id:'Shantell Sans',    label:'Shantell Sans',    scale:1.00, join: 0.005 },
];
// SPREAD_CAP is the ceiling of the continuous tracking range at scrap 0 (the
// slowest, most deliberate pen) — scaled by the Letter spread slider. Per
// glyph, tracking = lerp(SPREAD_CAP*letterSpread, font.join, scrap), and is
// NEVER allowed past that ceiling regardless of wobble (see `cap` in layout()).
const SPREAD_CAP = 0.046;
// The lifted-pen mask: full lift at scrap 0, tapering to none by scrap 0.6 —
// past that the connectors must stay clean and un-masked. See g.fadeEm.
const FADE_MAX = 0.05;      // em, full lift
const FADE_SCRAP_SPAN = 0.6; // scrap at which the taper reaches zero
const FADE_MIN = 0.02;       // below this, skip the mask entirely

/* ------------------------------ settings ------------------------------- */

const SPEC = [
  { key:'font',        type:'select', label:'Hand',              def:'Homemade Apple' },
  { key:'baseSize',    type:'range',  label:'Size',              def:28,   min:20,  max:40,  step:1,    fmt:v=>v+'px' },
  { key:'pauseThresh', type:'range',  label:'Pause threshold',   def:2.0,  min:0.5, max:5,   step:0.1,  fmt:v=>v.toFixed(1)+'s' },
  { key:'poolMax',     type:'range',  label:'Pool max',          def:5.0,  min:2,   max:10,  step:0.5,  fmt:v=>v.toFixed(1)+'s' },
  { key:'poolDark',    type:'range',  label:'Pool darkness',     def:0.95, min:0.5, max:1,   step:0.01, fmt:v=>v.toFixed(2) },
  { key:'poolBleed',   type:'range',  label:'Pool bleed',        def:0.55, min:0,   max:1.6, step:0.05, fmt:v=>v.toFixed(2) },
  { key:'scrapAmt',    type:'range',  label:'Scrappiness',       def:1.0,  min:0,   max:2,   step:0.05, fmt:v=>v.toFixed(2) },
  { key:'letterSpread',type:'range',  label:'Letter spread',     def:1.0,  min:0,   max:2,   step:0.05, fmt:v=>v.toFixed(2) },
  { key:'ghostOp',     type:'range',  label:'Ghost opacity',     def:1.0,  min:0.3, max:1,   step:0.01, fmt:v=>v.toFixed(2) },
  { key:'wobbleAmt',   type:'range',  label:'Wobble amount',     def:1.0,  min:0,   max:2.5, step:0.05, fmt:v=>v.toFixed(2) },
  { key:'wobbleOn',    type:'toggle', label:'Rhythm wobble',     def:true },
];

const S = {};
SPEC.forEach(s => S[s.key] = s.def);

// v5: Hands are single faces again (no print/cursive pairs) and letter
// spacing is a continuous, speed-driven ceiling (SPREAD_CAP) rather than a
// fixed slow-end constant — bumping the key retires stored v4 values.
const LS_KEY = 'pen-and-paper/settings/v5';
function loadSettings(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const o = JSON.parse(raw);
    SPEC.forEach(s => { if(o[s.key] !== undefined) S[s.key] = o[s.key]; });
  }catch(e){ /* first run, or storage blocked */ }
}
function saveSettings(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}
loadSettings();

/* --------------------------- deterministic noise ----------------------- */
// Layout must be reproducible: the same timeline + settings must always
// produce the same wobble, or resizing/font-switching would reshuffle ink.
function hash(n, salt){
  const x = Math.sin(n * 127.1 + (salt||0) * 311.7 + 74.7) * 43758.5453;
  return x - Math.floor(x);
}
const rnd = (n,salt) => hash(n,salt) * 2 - 1;   // -1..1

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
function mixColor(t){                            // graphite -> ink
  const c = GRAPHITE.map((g,i)=> Math.round(lerp(g, INK[i], t)));
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
}

/* ------------------------------ ink pools ------------------------------
   A pool is a pure function of how long the pen rested: it starts at the
   pause threshold and reaches full at "Pool max". The live growth loop and
   layout() both go through poolPhase/applyPool, so what you watch happen
   is exactly what a re-layout, a replay and the export will reproduce.
   ----------------------------------------------------------------------- */
function poolPhase(gapMs){
  const thresh = S.pauseThresh * 1000;
  const span   = Math.max(200, S.poolMax * 1000 - thresh);
  return clamp((gapMs - thresh) / span, 0, 1);
}
// the first sliver of a pool fades in rather than snapping on, so growth
// reads as continuous. It only ever scales the tuned values down.
const poolFade = p => clamp(p * 5, 0, 1);

function applyPool(g, p, base){
  if(p <= 0) return;
  const f = poolFade(p);
  g.pool    = Math.max(g.pool, p);
  g.opacity = Math.max(g.opacity, lerp(g.opacity, S.poolDark, f));
  g.density = Math.max(g.density, lerp(g.density, 1, f));
  // The blot (see blotCenter) now carries the story of where the pen
  // rested; the glyph itself should only swell a little, not visibly grow.
  g.size    = Math.max(g.size,    base * lerp(1, 1.015, f));
  g.blur    = Math.max(g.blur,    0.4 * f);
  g.color   = mixColor(g.density);
}

/* ============================== TIMELINE ==============================
   Events are the single source of truth. Types:
     char      {ch, t}          a character at the current writing position
     back      {t}              a backspace
     revstart  {anchor, t}      begin a revision over the word at `anchor`
     revcommit {t}              accept the pending revision
     revcancel {t}              discard it
     revstrike {anchor, t}      strike an existing floating revision (2-layer cap)
   ====================================================================== */

const Timeline = {
  events: [],
  push(e){ this.events.push(e); },
  clear(){ this.events.length = 0; },
  first(){ return this.events.length ? this.events[0].t : 0; },
  last(){ return this.events.length ? this.events[this.events.length-1].t : 0; },
};

/* ============================== MEASURER ==============================
   Canvas text metrics, cached per (font, char). Everything is measured at
   a reference size and scaled, so per-glyph size variation costs nothing.
   ====================================================================== */

const REF = 100;
const mctx = document.createElement('canvas').getContext('2d');
let wCache = new Map();
let metricCache = new Map();

function fontStack(font){ return '"'+font+'", cursive, sans-serif'; }

// width of one char, per 1px of font-size
function charW(font, ch){
  const k = font + '␀' + ch;
  let w = wCache.get(k);
  if(w === undefined){
    mctx.font = REF + 'px ' + fontStack(font);
    w = mctx.measureText(ch).width / REF;
    wCache.set(k, w);
  }
  return w;
}

// ascent / descent ratios, per 1px of font-size — these differ wildly
// between the five hands, so line height and baselines are derived, not fixed.
function fontMetrics(font){
  let m = metricCache.get(font);
  if(m) return m;
  mctx.font = REF + 'px ' + fontStack(font);
  const t = mctx.measureText('Hxjgy');
  let asc = t.fontBoundingBoxAscent, desc = t.fontBoundingBoxDescent;
  if(!asc || !isFinite(asc)) asc = 80;
  if(!desc || !isFinite(desc)) desc = 22;
  m = { asc: asc/REF, desc: desc/REF };
  m.lh   = (m.asc + m.desc) * 1.16;   // line height, per 1px of font-size
  m.top  = m.asc + (1 - m.asc - m.desc) / 2;  // baseline offset for line-height:1
  metricCache.set(font, m);
  return m;
}
function flushMeasureCache(){ wCache = new Map(); metricCache = new Map(); }

/* ============================== LAYOUT ================================ */

/**
 * Replay the event list into glyph objects, then position and style them.
 * Pure-ish: same (events, settings, nowT) always yields the same model.
 */
function layout(events, opts){
  opts = opts || {};
  const nowT   = opts.nowT !== undefined ? opts.nowT : Date.now();
  const font   = S.font;
  const face   = FONTS.find(f=>f.id===font) || FONTS[0];
  const baseSize = S.baseSize * face.scale;
  const M = fontMetrics(face.id);
  const ascPx  = M.asc  * baseSize;
  const descPx = M.desc * baseSize;
  const lh      = (ascPx + descPx) * 1.16;
  // a representative face/size for page furniture that isn't "the writing"
  // itself: placeholder, caption, revision caret mark. There's only one
  // face on the page now, so this is just it.
  const reprFont = face.id, reprBase = baseSize, reprM = M;
  // the tracking ceiling this page's Letter spread resolves to — never
  // below the face's own join floor, so the range stays valid at any
  // slider position (see FONTS' `join` doc comment above).
  const cap = Math.max(SPREAD_CAP * S.letterSpread, face.join);

  /* --- pass 1: build the streams from the event tape --- */
  const main = [];              // glyphs written in-line
  const all  = [];              // every glyph in creation order (for timing)
  const revisions = new Map();  // anchor -> {anchor, glyphs, struck, runId}
  let pending = null;           // the revision being composed right now
  let mode = 'append';
  let runId = 0, inBackRun = false;
  let prevT = null;

  function mkGlyph(ch, t, layer){
    const dt = prevT === null ? 900 : Math.max(0, t - prevT);
    prevT = t;
    const g = { ch, t, dt, seq: all.length, layer, struck:false, runId:-1 };
    all.push(g);
    return g;
  }
  function strikeRange(list, from, to, rid){
    for(let i=from;i<to;i++){
      if(!list[i].struck){ list[i].struck = true; list[i].runId = rid; }
    }
  }
  function wordEnd(list, anchor){
    let j = anchor;
    while(j < list.length && list[j].ch !== ' ' && list[j].ch !== '\n') j++;
    return j;
  }

  for(const e of events){
    if(e.type === 'char'){
      if(mode === 'revise'){
        pending.glyphs.push(mkGlyph(e.ch, e.t, 'rev'));
      }else{
        main.push(mkGlyph(e.ch, e.t, 'main'));
        inBackRun = false;
      }
    }
    else if(e.type === 'back'){
      if(mode === 'revise'){
        // The pending revision hasn't dried yet — it erases normally.
        const g = pending.glyphs.pop();
        if(g){ const i = all.indexOf(g); if(i>=0) all.splice(i,1); }
      }else{
        if(!inBackRun){ runId++; inBackRun = true; }
        for(let i = main.length-1; i >= 0; i--){
          if(!main[i].struck){ main[i].struck = true; main[i].runId = runId; break; }
        }
      }
    }
    else if(e.type === 'revstart'){
      mode = 'revise';
      pending = { anchor: e.anchor, glyphs: [], live:true };
      inBackRun = false;
    }
    else if(e.type === 'revcancel'){
      if(pending){ for(const g of pending.glyphs){ const i=all.indexOf(g); if(i>=0) all.splice(i,1); } }
      mode = 'append'; pending = null;
    }
    else if(e.type === 'revcommit'){
      if(pending && pending.glyphs.length){
        runId++;
        strikeRange(main, pending.anchor, wordEnd(main, pending.anchor), runId);
        pending.live = false;
        revisions.set(pending.anchor, pending);
      }else if(pending){
        // nothing typed — treat as a cancel
      }
      mode = 'append'; pending = null;
    }
    else if(e.type === 'revstrike'){
      const r = revisions.get(e.anchor);
      if(r && !r.struck){ runId++; r.struck = true; r.runId = runId; for(const g of r.glyphs){ g.struck = true; g.runId = runId; } }
    }
  }
  // re-index after any splices so seq is contiguous
  all.forEach((g,i)=> g.seq = i);
  if(pending) revisions.set(pending.anchor, pending);

  /* --- pass 2: timing -> the discipline of the hand --------------------
     Speed says nothing about how much ink hits the page — a fast pen is
     not a darker pen. What speed changes is whether the pen LIFTS.

     Slow, deliberate writing prints: each letter is set down on its own,
     upright, with daylight around it. Fast writing is cursive — the nib
     never leaves the paper, so the exit stroke of one letter runs into the
     entry stroke of the next and the word becomes a single gesture.

     That forces a rule: WITHIN a word nothing may break the join. No
     per-letter rotation, no per-letter size, no per-letter baseline — the
     strokes can only meet if every letter of the word shares one baseline,
     one slant and one size. The unruliness of a hurrying hand therefore
     lives a level up, on the WORD: whole words lean, drift off the line and
     swell or shrink together. Letters flow; words stagger.
     ---------------------------------------------------------------------- */
  const N = all.length;

  for(let i=0;i<N;i++){
    const g = all[i];

    // (1) smoothed pace over a rolling window of 5 -> scrappiness 0..1
    let sum = 0, cnt = 0;
    for(let k = Math.max(0, i-4); k <= i; k++){ sum += Math.min(all[k].dt, DT_CAP); cnt++; }
    const avg = sum / cnt;
    // norm: 0 = flying, 1 = deliberate
    const norm = clamp(
      (Math.log(Math.max(avg, 8)) - Math.log(FAST_MS)) / (Math.log(SLOW_MS) - Math.log(FAST_MS)),
      0, 1);
    // A deadzone below SCRAP_KNEE (exactly 0, so the slow hand is ruled-flat),
    // then a smoothstep ramp to full mess at the top of the range. The S-curve
    // keeps the onset from popping while still making the two states obvious.
    const speed = 1 - norm;
    const u = clamp((speed - SCRAP_KNEE) / (1 - SCRAP_KNEE), 0, 1);
    const scrap = clamp(u * u * (3 - 2 * u) * S.scrapAmt, 0, 1);
    g.speed = speed;
    g.scrap = scrap;
    // the lifted-pen edge fade, in em of this glyph's own size: full lift
    // when the pen is at its most deliberate (scrap 0), tapering to zero by
    // scrap 0.6 — fast joins stay clean and never carry a mask. Continuous,
    // no threshold; the render/export layer skips the mask below FADE_MIN.
    g.fadeEm = clamp(1 - scrap / FADE_SCRAP_SPAN, 0, 1) * FADE_MAX;
    // the pen entrance: quick flicks when fast, unhurried strokes when slow
    g.revealMs = Math.round(lerp(215, 68, speed));

    // (2) Ink pressure. A careful hand presses EVENLY — so this unevenness is
    // gated by scrappiness too, exactly like the geometry. At the slow end
    // every letter is the same weight and the same colour; patchy, uneven ink
    // is a symptom of a hurrying pen, and it was the last thing making the
    // deliberate hand read as messy after the geometry went flat.
    g.density = clamp(0.90 + rnd(g.seq, 8) * 0.05 * scrap, 0, 1);
    g.opacity = clamp(0.86 + rnd(g.seq, 7) * 0.05 * scrap, 0, 1);
    g.blur    = 0;
    g.pool    = 0;

    // (3) rhythm wobble: variance of recent intervals loosens the line.
    // A second source of looseness — but it is GATED by scrappiness, so the
    // deliberate end of the axis is genuinely ruled-line straight. Wobble can
    // only roughen a hand that is already hurrying; it can't unsettle a
    // careful one, however uneven the pauses between careful marks are.
    let vj = 0;
    if(S.wobbleOn){
      const w = [];
      for(let k = Math.max(0, i-7); k <= i; k++) w.push(Math.min(all[k].dt, DT_CAP));
      const m = w.reduce((a,b)=>a+b,0) / w.length;
      const v = Math.sqrt(w.reduce((a,b)=>a+(b-m)*(b-m),0) / w.length) / 320;
      // Gated by scrap, which is exactly 0 below the knee — so the careful
      // hand is ruled-flat, with no residual wobble at all.
      vj = clamp(v, 0, 1.4) * S.wobbleAmt * scrap;
    }
    g.vj = vj;
  }

  /* (5) the word pass: lean, drift and swell, uniform across the word — the
     unruliness of a hurrying hand lives on the WORD, never the letter, so
     the strokes of a joined word still meet (one baseline, one slant, one
     size). Tracking, though, is resolved PER GLYPH (not per word): it's the
     one thing the user wants breathing continuously with speed, letter to
     letter, inside the word. A word's lean/drift/swell character comes from
     the mean pace of its own letters, and its seeded variation from the seq
     of its first letter — so it is stable across re-layouts, font switches,
     resizes and replay. */
  function wordPass(list){
    let i = 0;
    while(i < list.length){
      const g = list[i];
      if(g.ch === ' ' || g.ch === '\n'){
        // A space isn't part of a word, but it still tracks continuously off
        // its own scrap. It keeps its full measure, and never a negative
        // one, so that however hard the hand hurries, words stay words.
        g.font = face.id; g.faceScale = face.scale; g.topK = M.top;
        let te = lerp(cap, face.join, g.scrap);
        te += rnd(g.seq, 2) * 0.045 * g.vj;
        g.trackEm = clamp(te, face.join, cap);
        g.size = baseSize;
        g.tracking = Math.max(0, g.trackEm * baseSize);
        g.skew = 0; g.rot = 0; g.jitter = 0;
        i++; continue;
      }
      let j = i, ss = 0, vv = 0;
      while(j < list.length && list[j].ch !== ' ' && list[j].ch !== '\n'){
        ss += list[j].scrap; vv += list[j].vj; j++;
      }
      const n  = j - i;
      const ms = ss / n, mv = vv / n;      // the word's own pace
      const s0 = list[i].seq;              // its seed
      // The messy state is now rare (see SCRAP_KNEE), so when it arrives it
      // should be unmistakable from across a room.
      const lean  = -19 * ms * (1 + rnd(s0, 11) * 0.30);
      const drift = rnd(s0, 12) * (5.4 * ms + 1.8 * mv);
      const swell = 1 + rnd(s0, 13) * 0.12 * ms;
      for(let k = i; k < j; k++){
        const gg = list[k];
        gg.font = face.id; gg.faceScale = face.scale; gg.topK = M.top;
        // per-letter tracking: the measure of how far the pen travelled
        // between two strokes, held in em so a word-level size change can't
        // reopen a join. At rest: SPREAD_CAP (scaled by the "Letter spread"
        // slider), continuously per glyph off that glyph's own scrap — never
        // past the cap. At speed it closes onto this face's own join
        // distance and stops dead there — never past it either.
        let te = lerp(cap, face.join, gg.scrap);
        te += rnd(gg.seq, 2) * 0.045 * gg.vj;
        gg.trackEm = clamp(te, face.join, cap);
        gg.skew = lean;      // one slant, or the strokes meet at an angle
        gg.jitter = drift;   // one baseline, or they meet at the wrong height
        gg.rot = 0;          // no letter turns against its neighbours
        gg.size = baseSize * swell;
        gg.tracking = gg.trackEm * gg.size;
      }
      i = j;
    }
  }
  wordPass(main);
  for(const r of revisions.values()) wordPass(r.glyphs);

  // (2) pause -> ink pool. A glyph pools if the NEXT mark came long after it.
  // The pen rests on the last LETTER, not on the space after it — otherwise
  // the commonest hesitation of all (finish a word, then think) leaves no mark.
  const threshMs = S.pauseThresh * 1000;
  const lastT = events.length ? events[events.length-1].t : 0;
  let hesitations = 0;
  // Every pause pools, including the trailing one: a finished page is allowed
  // to carry the mark of the pen that stopped on it.
  for(let i=0;i<N;i++){
    const gap = (i < N-1) ? all[i+1].dt : Math.max(0, nowT - lastT);
    if(gap <= threshMs) continue;
    if(i < N-1) hesitations++;   // the caption counts pauses BETWEEN marks
    let k = i;
    while(k > 0 && (all[k].ch === ' ' || all[k].ch === '\n')) k--;
    const g = all[k];
    if(g.ch === ' ' || g.ch === '\n' || g.struck) continue;
    applyPool(g, poolPhase(gap), S.baseSize * g.faceScale);
  }

  // Struck ink keeps its weight — crossing a word out doesn't lift ink off
  // the paper. The hairline through it is the only record of the deletion.
  for(const g of all){
    if(g.struck){
      g.opacity = clamp(g.opacity * S.ghostOp, 0.04, 1);
      g.blur = 0;
      g.pool = 0;
    }
    g.color = mixColor(g.density);
  }

  /* --- pass 3: position the main stream, wrapping at spaces --- */
  const advOf = g => charW(g.font, g.ch) * g.size + g.tracking;
  const ascPart = ascPx * 1.06;
  const lineY = k => PAD_TOP + lh * k + ascPart;

  let x = 0, line = 0;
  let i = 0;
  while(i < main.length){
    const g = main[i];
    if(g.ch === '\n'){
      // A newline is a zero-width event. Struck (backspaced over) it leaves
      // no ink to cross out and no break: the caret simply carries on with
      // the previous line, exactly as if the Enter had never been pressed.
      g.x = x; g.line = line; g.y = lineY(line); g.adv = 0;
      if(!g.struck){ x = 0; line++; }
      i++; continue;
    }
    if(g.ch === ' '){
      g.adv = advOf(g); g.x = x; g.line = line; g.y = lineY(line);
      x += g.adv; i++; continue;
    }
    // measure the whole word so we never break mid-word
    let j = i, w = 0;
    while(j < main.length && main[j].ch !== ' ' && main[j].ch !== '\n'){ w += advOf(main[j]); j++; }
    if(w > COL_W){
      // pathological long word: break per character
      for(let k=i;k<j;k++){
        const gg = main[k], a = advOf(gg);
        if(x + a > COL_W && x > 0){ x = 0; line++; }
        gg.adv = a; gg.x = x; gg.line = line; gg.y = lineY(line); x += a;
      }
      i = j; continue;
    }
    if(x + w > COL_W && x > 0){ x = 0; line++; }
    for(let k=i;k<j;k++){
      const gg = main[k], a = advOf(gg);
      gg.adv = a; gg.x = x; gg.line = line; gg.y = lineY(line); x += a;
    }
    i = j;
  }
  const caret = { x, y: lineY(line), h: (ascPx + descPx) * 0.86, line };

  /* --- pass 4: place revisions above their word --- */
  const revItems = [];
  for(const [anchor, r] of revisions){
    if(!r.glyphs.length) continue;
    const end = wordEnd(main, anchor);
    if(anchor >= main.length) continue;
    const a = main[anchor];
    // the word's on-page extent (use the first line if the word itself wrapped)
    let x0 = a.x, x1 = a.x, ln = a.line;
    for(let k = anchor; k < end; k++){
      if(main[k].line !== ln) break;
      x1 = main[k].x + main[k].adv;
    }
    const scale = 0.75;
    let w = 0;
    for(const g of r.glyphs){
      g.size *= scale; g.tracking *= scale; g.jitter *= scale;
      w += charW(g.font, g.ch) * g.size + g.tracking;
    }
    let rx = clamp((x0 + x1)/2 - w/2, 0, Math.max(0, COL_W - w));
    const ry = a.y - lh * 0.60;
    for(const g of r.glyphs){
      g.x = rx; g.y = ry; g.line = -1; g.adv = charW(g.font, g.ch)*g.size + g.tracking;
      rx += g.adv;
    }
    r.markX = (x0 + x1) / 2;
    r.markY = a.y - lh * 0.30;   // sits in the gap, pointing down at the word
    r.markSize = reprBase * 0.42;
    r.wordX0 = x0; r.wordX1 = x1; r.wordY = a.y; r.wordLine = ln;
    revItems.push(r);
  }

  /* --- pass 5: strike segments (one continuous hairline per run, per line) --- */
  const strikes = [];
  function collect(list){
    let k = 0;
    while(k < list.length){
      const g = list[k];
      // a struck newline is never the start of a hairline — it has no ink
      if(!g.struck || g.ch === '\n'){ k++; continue; }
      const rid = g.runId, ln = g.line;
      let x0 = g.x, x1 = g.x + g.adv, sz = g.size, y = g.y, k2 = k+1;
      while(k2 < list.length && list[k2].struck && list[k2].runId === rid && list[k2].line === ln){
        x1 = list[k2].x + list[k2].adv; sz = Math.max(sz, list[k2].size); k2++;
      }
      strikes.push({ x0, x1, y: y - sz * 0.30, seed: rid * 7 + ln, w: Math.max(5.6, sz*0.28) });
      k = k2;
    }
  }
  collect(main);
  for(const r of revItems) if(r.struck) collect(r.glyphs);

  /* --- stats for the caption --- */
  let unsaid = 0, prevStruck = false;
  for(const g of main){
    const s = g.struck && g.ch !== ' ' && g.ch !== '\n';
    if(s && !prevStruck) unsaid++;
    prevStruck = s;
  }
  for(const r of revItems) if(r.struck) unsaid++;

  const lastLine = Math.max(line, ...revItems.map(r=>r.wordLine), 0);
  const height = PAD_TOP + lh * (lastLine + 1) + PAD_BOT;

  return {
    font, lh, main, revisions:revItems, strikes, caret, all,
    // representative face/size for page furniture that isn't "the writing"
    // itself: placeholder, caption, revision caret mark.
    reprFont, reprBase, reprMetrics: reprM, line0Y: PAD_TOP + ascPart,
    height, lines: lastLine + 1,
    stats: {
      duration: events.length ? Math.round((Timeline.last() - Timeline.first())/1000) : 0,
      hesitations, unsaid,
    },
  };
}

/* ============================== RENDERER ============================== */

const elPage   = document.getElementById('page');
const elGlyphs = document.getElementById('glyphs');
const elSvg    = document.getElementById('strikes');
const elCaret  = document.getElementById('caret');
const elPh     = document.getElementById('placeholder');
const elCap    = document.getElementById('caption');

// The pen-stroke reveal's mask must persist WHILE the animation runs (so the
// travelling gradient has something to reveal), but not a moment after: once
// the stroke lands, this is finished ink and should carry no mask at all —
// otherwise, since .reveal stays on the most-recently-rendered glyph until
// the next re-render, only the newest letter would ever have full-height ink.
// elGlyphs itself persists across re-renders (only its children are
// replaced), so one delegated listener here covers every glyph ever drawn.
elGlyphs.addEventListener('animationend', e => {
  if(e.animationName === 'penstroke') e.target.classList.remove('reveal');
});

let model = null;
let selection = null;   // {anchor} while a word is selected / being revised

// The entrance is a property of the RENDER, not of the glyph: only a mark
// that was just made gets drawn on. Re-layouts (font, resize, sliders) redraw
// the same ink without re-performing it.
let pendingEntrance = false;

// the one glyph the live pool loop is allowed to touch, and its two elements
let poolTargetG = null, poolTargetEl = null, poolTargetBlot = null;

// A glyph carries its own resolved face (g.font, g.topK) from layout()'s
// wordPass, so styling reads straight off the glyph.
//
// This styles the OUTER (.g) span: position, font context, color/opacity,
// the word-level transform, and — when the pen was lifted for this glyph
// (g.fadeEm) — the edge-fade mask. The fade is built from symmetric
// horizontal padding plus a compensating negative margin: padding widens the
// box so the mask's taper has connector-overflow to work with on each side,
// and the negative margin pulls the box back so the glyph's own ink doesn't
// visibly shift. The mask-image gradient itself is opaque in the middle and
// transparent at the very edges, tapering over g.fadeEm on each side. Below
// FADE_MIN no mask is applied at all — fast joins stay clean.
function glyphStyle(g){
  let css = 'left:'+g.x.toFixed(2)+'px;'+
    'top:'+(g.y - g.size*g.topK).toFixed(2)+'px;'+
    'font:'+g.size.toFixed(2)+'px/1 '+fontStack(g.font)+';'+
    'color:'+g.color+';opacity:'+g.opacity.toFixed(3)+';'+
    'transform:translateY('+g.jitter.toFixed(2)+'px) skewX('+g.skew.toFixed(2)+'deg) '+
      'rotate('+g.rot.toFixed(2)+'deg);';
  // The lifted-pen edge fade (back in, 2026-07-30, at FADE_MAX 0.1 — see
  // NOTES.md before touching this again). A plain horizontal mask rasterizes
  // the element to ITS OWN BOX, and these hands draw well outside a tight
  // line-height:1 box (tall ascenders/flourishes) — that's what sheared tops
  // off three times before the mask was pulled entirely. The guard: generous
  // vertical padding widens the rasterization box enough to hold the whole
  // glyph, with a matching negative margin so the box doesn't visibly shift;
  // horizontal padding does the same for the taper's own overflow. No filter
  // and no blur here — same clipping risk, and pools already speak through
  // darkening + the blot alone. Skip the mask below FADE_MIN so fast joins
  // stay clean.
  if(g.fadeEm > FADE_MIN){
    const padH = g.fadeEm * g.size * 0.6;
    const padV = g.size * 0.65;
    const m = 'linear-gradient(90deg, transparent 0, black '+g.fadeEm+'em, '+
      'black calc(100% - '+g.fadeEm+'em), transparent 100%)';
    css += 'padding:'+padV.toFixed(2)+'px '+padH.toFixed(2)+'px;'+
      'margin:-'+padV.toFixed(2)+'px -'+padH.toFixed(2)+'px;'+
      '-webkit-mask-image:'+m+';mask-image:'+m+';';
  }
  return css;
}
// Real ink gathers where the pen STOPS, not over the whole letter: at the
// stroke's exit (the right end of the glyph's advance), sitting on the
// baseline. A small seeded jitter keeps repeated pools from looking stamped
// in the same spot every time. Shared by the DOM renderer, the live
// pool-growth loop, and the canvas export, so all three agree exactly.
function blotCenter(g){
  const jx = rnd(g.seq, 41) * g.size * 0.05;
  const jy = rnd(g.seq, 42) * g.size * 0.05;
  return {
    cx: g.x + g.adv * 0.9 + jx,
    cy: g.y - g.size * 0.05 + jy,
  };
}
function blotStyle(g){
  const r = g.size * (0.16 + g.pool * 0.42 * S.poolBleed);
  const c = blotCenter(g);
  return 'left:'+c.cx+'px;top:'+c.cy+'px;'+
    'width:'+(r*2)+'px;height:'+(r*2)+'px;'+
    'opacity:'+poolFade(g.pool).toFixed(3)+';'+
    (g.pool > 0 ? '' : 'display:none;')+
    'background:radial-gradient(circle, rgba(28,26,23,'+(0.30*S.poolDark).toFixed(3)+') 0%, '+
      'rgba(28,26,23,'+(0.13*S.poolDark).toFixed(3)+') 38%, rgba(28,26,23,0) 72%);';
}

// which glyph a trailing pause would settle on — mirrors the pool loop above
function trailingTarget(m){
  let k = m.all.length - 1;
  while(k > 0 && (m.all[k].ch === ' ' || m.all[k].ch === '\n')) k--;
  const g = m.all[k];
  if(!g || g.ch === ' ' || g.ch === '\n' || g.struck) return null;
  return g;
}

function wobblyPath(s){
  // a hairline that remembers it was drawn by a hand
  const len = Math.max(6, s.x1 - s.x0);
  const steps = Math.max(3, Math.round(len / 14));
  const amp = 0.9;
  let d = '';
  for(let i=0;i<=steps;i++){
    const t = i/steps;
    const x = s.x0 + len*t;
    const y = s.y + Math.sin(t*Math.PI*1.7 + s.seed) * amp * (0.35 + 0.65*Math.sin(t*Math.PI))
                  + rnd(s.seed*31 + i, 5) * 0.35;
    d += (i ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2);
  }
  return d;
}

function render(m){
  model = m;
  elPage.style.height = m.height + 'px';

  // the newest mark — the only one that gets performed rather than just drawn
  const fresh = (pendingEntrance && m.all.length) ? m.all[m.all.length-1] : null;
  pendingEntrance = false;

  poolTargetG = trailingTarget(m);
  poolTargetEl = poolTargetBlot = null;

  // --- glyphs ---
  const frag = document.createDocumentFragment();
  const emit = (g, idx, revAnchor) => {
    const isRev = revAnchor !== undefined;
    if(g.ch === ' ' || g.ch === '\n') return;
    // the pool target always gets a blot, even an empty one: the live growth
    // loop needs something to grow, and must never add a second one.
    if(g.pool > 0 || g === poolTargetG){
      const blot = document.createElement('div');
      blot.className = 'blot';
      blot.style.cssText = blotStyle(g);
      if(g === poolTargetG) poolTargetBlot = blot;
      frag.appendChild(blot);
    }
    // The outer span (.g) is positioned and carries the lifted-pen fade
    // mask; the inner span (.gi) carries the character and the entrance
    // reveal mask/animation. Nested rather than layered on one element so
    // the two masks intersect instead of fighting (see the .gi CSS comment).
    const outer = document.createElement('span');
    // A committed revision is itself clickable — that's how you revise the
    // revision (which strikes it and drops you back in-line: the two-layer cap).
    const live = isRev && !g.struck && revAnchor >= 0;
    outer.className = 'g' + (g.struck ? '' : (isRev ? (live ? ' click' : '') : ' click'));
    if(isRev){ if(live) outer.dataset.rev = revAnchor; }
    else if(!g.struck && idx !== undefined) outer.dataset.i = idx;
    outer.style.cssText = glyphStyle(g);

    const inner = document.createElement('span');
    inner.className = 'gi' + (g === fresh ? ' reveal' : '');
    inner.textContent = g.ch;
    if(g === fresh) inner.style.setProperty('--rd', g.revealMs + 'ms');
    outer.appendChild(inner);

    if(g === poolTargetG) poolTargetEl = outer;
    frag.appendChild(outer);
  };

  m.main.forEach((g,i)=> emit(g, i, undefined));
  for(const r of m.revisions){
    r.glyphs.forEach(g => emit(g, undefined, r.live ? -1 : r.anchor));
    const mark = document.createElement('span');
    mark.className = 'g';
    mark.textContent = '∧';
    mark.style.cssText =
      'left:'+(r.markX - r.markSize*0.34)+'px;top:'+(r.markY - r.markSize*m.reprMetrics.top)+'px;'+
      'font:'+r.markSize.toFixed(2)+'px/1 '+fontStack(m.reprFont)+';'+
      'color:'+mixColor(0.8)+';opacity:'+(0.72 * (r.struck ? S.ghostOp : 1)).toFixed(3)+';';
    frag.appendChild(mark);
  }

  // selection feedback: a quiet graphite underline
  if(selection){
    const a = m.main[selection.anchor];
    if(a){
      let x1 = a.x;
      for(let k = selection.anchor; k < m.main.length; k++){
        if(m.main[k].ch === ' ' || m.main[k].ch === '\n' || m.main[k].line !== a.line) break;
        x1 = m.main[k].x + m.main[k].adv;
      }
      const u = document.createElement('div');
      u.className = 'selunder';
      u.style.cssText = 'left:'+a.x+'px;top:'+(a.y + a.size*0.16)+'px;width:'+(x1-a.x)+'px;';
      frag.appendChild(u);
    }
  }

  elGlyphs.replaceChildren(frag);

  // --- strikes ---
  elSvg.setAttribute('width', COL_W);
  elSvg.setAttribute('height', m.height);
  let svg = '';
  for(const s of m.strikes){
    svg += '<path d="'+wobblyPath(s)+'" fill="none" stroke="'+mixColor(0.55)+
           '" stroke-opacity="'+STRIKE_OP+
           '" stroke-width="'+s.w.toFixed(2)+'" stroke-linecap="round"/>';
  }
  elSvg.innerHTML = svg;

  // --- caret ---
  let cx = m.caret.x, cy = m.caret.y, ch = m.caret.h;
  if(selection && selection.pending){
    const r = m.revisions.find(r => r.anchor === selection.anchor && r.live);
    if(r && r.glyphs.length){
      const last = r.glyphs[r.glyphs.length-1];
      cx = last.x + last.adv; cy = last.y; ch = last.size * 1.1;
    }else{
      const a = m.main[selection.anchor];
      if(a){ cx = (a.x + (a.x + a.adv))/2; cy = a.y - m.lh*0.60; ch = a.size*0.75; }
    }
  }
  elCaret.style.cssText = 'left:'+cx+'px;top:'+(cy-ch*0.82)+'px;height:'+ch+'px;';

  // --- placeholder ---
  if(m.main.length === 0 && !replaying){
    elPh.style.display = 'block';
    elPh.style.left = '0px';
    elPh.style.top  = (m.line0Y - m.reprBase*m.reprMetrics.top) + 'px';
    elPh.style.font = m.reprBase.toFixed(2)+'px/1 '+fontStack(m.reprFont);
  }else{
    elPh.style.display = 'none';
  }

  // --- caption position ---
  elCap.style.top = (m.height - PAD_BOT + m.lh * 1.2) + 'px';
  elCap.style.font = (m.reprBase*0.42).toFixed(2)+'px/1.5 '+fontStack(m.reprFont);
  elCap.innerHTML = captionHTML(m);

  // the DOM was just rebuilt, so the growth loop needs its new handles
  if(!replaying) startLivePool();
}

function captionText(m){
  const st = m.stats;
  return st.duration + 's · ' + st.hesitations + ' hesitation' + (st.hesitations===1?'':'s') +
         ' · ' + st.unsaid + ' word' + (st.unsaid===1?'':'s') + ' unsaid';
}
function dateText(){
  const d = new Date();
  return d.toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});
}
function captionHTML(m){
  return captionText(m) + '<br><span class="d">' + dateText() + '</span>';
}

/* ============================== INPUT ================================= */

let firstKeyDone = false;
let idleTimer = null;
let replaying = false;

function relayout(opts){
  render(layout(Timeline.events, opts));
}

/* --------------------------- live ink pooling --------------------------
   While the writer sits still, the pen keeps bleeding into the paper. This
   loop touches exactly two elements — the resting glyph and its blot — and
   never re-runs layout. It computes the pool through the same poolPhase /
   applyPool the tape does, so when typing resumes and layout freezes the
   pool from the recorded gap, nothing jumps.
   ----------------------------------------------------------------------- */
let liveRAF = null, liveTimer = null;

function stopLivePool(){
  if(liveRAF){ cancelAnimationFrame(liveRAF); liveRAF = null; }
  clearTimeout(liveTimer); liveTimer = null;
}

function startLivePool(){
  stopLivePool();
  if(!model || !poolTargetG || !poolTargetEl) return;
  const evs = Timeline.events;
  if(!evs.length) return;

  const g0 = poolTargetG, el = poolTargetEl, blot = poolTargetBlot;
  const lastT = evs[evs.length-1].t;
  let shown = -1;

  const step = () => {
    const p = poolPhase(Date.now() - lastT);
    if(p - shown > 0.002){
      shown = p;
      // pg keeps g0's own resolved face (font/topK/faceScale/x/adv/y) —
      // Object.assign copies those straight through, so applyPool/glyphStyle/
      // blotStyle read the same face and rest-point the live loop as layout().
      const pg = Object.assign({}, g0);
      applyPool(pg, p, S.baseSize * g0.faceScale);
      el.style.cssText = glyphStyle(pg);
      if(blot) blot.style.cssText = blotStyle(pg);
    }
    liveRAF = p < 1 ? requestAnimationFrame(step) : null;
  };

  // nothing to do until the pause threshold is crossed
  const wait = S.pauseThresh*1000 - (Date.now() - lastT);
  if(wait > 0) liveTimer = setTimeout(()=>{ liveRAF = requestAnimationFrame(step); }, wait + 16);
  else liveRAF = requestAnimationFrame(step);
}

function scheduleIdleCaption(){
  clearTimeout(idleTimer);
  elCap.classList.remove('show');
  idleTimer = setTimeout(()=>{
    if(!replaying && Timeline.events.length){ relayout(); elCap.classList.add('show'); }
  }, IDLE_CAP);
}
function touched(){ scheduleIdleCaption(); }   // render() restarts the pool loop

function commitRevision(){
  if(!selection || !selection.pending) return;
  Timeline.push({ type:'revcommit', t: Date.now() });
  selection = null;
  relayout(); touched();
}
function cancelRevision(){
  if(!selection) return;
  if(selection.pending) Timeline.push({ type:'revcancel', t: Date.now() });
  selection = null;
  relayout();
}

function typeChar(ch){
  const t = Date.now();
  if(!firstKeyDone){ firstKeyDone = true; elPh.style.opacity = '0'; }
  if(selection){
    if(ch === ' ' || ch === '\n'){
      if(selection.pending){ commitRevision(); return; }
      cancelRevision();
      // fall through and write the space in-line
    }else{
      if(!selection.pending){
        Timeline.push({ type:'revstart', anchor: selection.anchor, t });
        selection.pending = true;
      }
      Timeline.push({ type:'char', ch, t });
      pendingEntrance = true;
      relayout(); touched(); return;
    }
  }
  Timeline.push({ type:'char', ch, t });
  pendingEntrance = true;
  relayout(); touched();
}

function backspace(){
  Timeline.push({ type:'back', t: Date.now() });
  if(selection && selection.pending){
    // nothing more to erase in the pending revision? leave revision mode open
  }
  relayout(); touched();
}

window.addEventListener('keydown', e => {
  if((e.metaKey || e.ctrlKey) && (e.key === '/' || e.code === 'Slash')){
    e.preventDefault(); togglePanel(); return;
  }
  if(e.target && e.target.closest && e.target.closest('#panel')) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(replaying) return;

  if(e.key === 'Escape'){ e.preventDefault(); cancelRevision(); return; }
  if(e.key === 'Backspace'){ e.preventDefault(); backspace(); return; }
  if(e.key === 'Enter'){ e.preventDefault(); typeChar('\n'); return; }
  if(e.key.length === 1){ e.preventDefault(); typeChar(e.key); return; }
});

// click a written word to revise it above the line
elPage.addEventListener('mousedown', e => {
  if(replaying) return;
  if(e.target.closest('#panel')) return;
  const span = e.target.closest('.g.click');
  if(!span){
    if(selection){ if(selection.pending) commitRevision(); else cancelRevision(); }
    return;
  }
  // two-layer cap: clicking a committed revision strikes it, and writing
  // simply resumes in-line rather than stacking a third layer above the page.
  if(span.dataset.rev !== undefined){
    e.preventDefault();
    if(selection){ if(selection.pending) commitRevision(); else cancelRevision(); }
    Timeline.push({ type:'revstrike', anchor:+span.dataset.rev, t:Date.now() });
    selection = null; relayout(); touched();
    return;
  }
  if(span.dataset.i === undefined){
    if(selection){ if(selection.pending) commitRevision(); else cancelRevision(); }
    return;
  }
  e.preventDefault();
  const idx = +span.dataset.i;
  // walk left to the start of the word
  let a = idx;
  while(a > 0){
    const p = model.main[a-1];
    if(p.ch === ' ' || p.ch === '\n' || p.struck) break;
    a--;
  }
  if(selection){ if(selection.pending) commitRevision(); else cancelRevision(); }

  // two-layer cap: a word revised once can't be revised again — strike the
  // floating word instead, and let writing continue in-line.
  const existing = model.revisions.find(r => r.anchor === a && !r.live);
  if(existing){
    if(!existing.struck) Timeline.push({ type:'revstrike', anchor:a, t:Date.now() });
    selection = null; relayout(); touched(); return;
  }
  selection = { anchor:a, pending:false };
  relayout();
});

window.addEventListener('resize', () => { if(model) relayout(); });

/* =============================== VOICE ================================ */
/* Dictation is just a second hand on the same pen. Interim results from
   SpeechRecognition stream in as you speak: a word is written the moment
   the recognizer is confident in it (everything but the still-volatile
   trailing word), so ink trails the voice by roughly a word. When the
   recognizer revises a word it already gave us, the correction happens the
   only way this page allows — the old word is struck and rewritten. The
   machine has second thoughts too. And silence between phrases is a real
   gap in Timeline timestamps, which is exactly what pools ink. */

const elMic = document.getElementById('mic');
const SRCls = window.SpeechRecognition || window.webkitSpeechRecognition;

let rec = null;
let micOn = false;
let voiceQueue = [];   // pen ops: chars to write, '\b' to strike one glyph back
let voiceTimer = null;
let uttWords = [];     // words of the current utterance already queued
// The pen keeps the speaker's pace. Words arrive from the recognizer in
// bursts that mirror speech rate, so ms-per-char between arrivals IS the
// voice's tempo — fast talk drives dt toward FAST_MS and the hand goes
// scrappy, slow deliberate speech keeps it neat.
let voicePace = 90;    // ms per char, smoothed from arrival rate
let lastArrival = 0;

function updateMic(){
  elMic.style.font = '19px/1 ' + fontStack(S.font);
  elMic.classList.toggle('on', micOn);
  elMic.querySelector('.lbl').textContent = micOn ? 'listening' : 'listen';
}

function penPace(tok){
  if(tok === '\b') return 55 + Math.random()*35;
  const base = tok === ' ' ? voicePace * 1.6 : voicePace;
  return base * (0.75 + Math.random()*0.5);
}

function voiceTick(){
  voiceTimer = null;
  if(!voiceQueue.length) return;
  if(replaying){ voiceTimer = setTimeout(voiceTick, 400); return; }
  const tok = voiceQueue.shift();
  if(tok === '\b') backspace(); else typeChar(tok);
  if(voiceQueue.length) voiceTimer = setTimeout(voiceTick, penPace(voiceQueue[0]));
}

function queueOps(str){
  if(str.length && str[0] !== '\b'){
    const now = performance.now();
    if(lastArrival){
      const gap = now - lastArrival;
      if(gap < 4000){
        const per = Math.max(38, Math.min(220, gap / str.length));
        voicePace = voicePace * 0.35 + per * 0.65;
      }
    }
    lastArrival = now;
  }
  voiceQueue.push(...str);
  if(!voiceTimer) voiceTimer = setTimeout(voiceTick, 0);
}

function syncUtterance(text, done){
  const words = text.replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
  // the trailing word of an interim result is the volatile one — hold it
  const stable = done ? words : words.slice(0, -1);
  if(!stable.length){ if(done) uttWords = []; return; }
  let i = 0;
  while(i < uttWords.length && i < stable.length &&
        uttWords[i].toLowerCase() === stable[i].toLowerCase()) i++;
  // words the recognizer took back get struck, one glyph per back-op
  if(i < uttWords.length){
    let backs = 0;
    for(let j = i; j < uttWords.length; j++) backs += uttWords[j].length + (j > i ? 1 : 0);
    queueOps('\b'.repeat(backs));
    uttWords = uttWords.slice(0, i);
  }
  const seg = stable.slice(i);
  if(seg.length){
    let pre = ' ';
    if(!uttWords.length && !voiceQueue.length){
      const last = (model && model.main.length) ? model.main[model.main.length-1].ch : '\n';
      if(last === ' ' || last === '\n') pre = '';
    }
    queueOps(pre + seg.join(' '));
    uttWords = uttWords.concat(seg);
  }
  if(done) uttWords = [];
}

function flushVoice(){
  voiceQueue = []; uttWords = [];
  voicePace = 90; lastArrival = 0;
  if(voiceTimer){ clearTimeout(voiceTimer); voiceTimer = null; }
}

function startRec(){
  rec = new SRCls();
  rec.continuous = true;
  rec.interimResults = true;
  // fixed, not navigator.language — a zh/other system locale would make the
  // recognizer sit silent through English speech
  rec.lang = 'en-US';
  rec.onstart      = () => console.debug('[voice] start');
  rec.onaudiostart = () => console.debug('[voice] audio flowing');
  rec.onspeechstart= () => console.debug('[voice] speech detected');
  rec.onresult = e => {
    console.debug('[voice] result', JSON.stringify([...e.results].map(r => r[0].transcript + (r.isFinal ? ' [final]' : ''))));
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal) syncUtterance(r[0].transcript, true);
      else interim += r[0].transcript;
    }
    if(interim) syncUtterance(interim, false);
  };
  // Chrome ends recognition on its own after a stretch of silence;
  // while the mic mark is on, silence is content, so start it back up.
  rec.onend = () => { console.debug('[voice] end'); if(micOn){ try{ rec.start(); }catch(err){} } };
  rec.onerror = e => {
    console.debug('[voice] error:', e.error);
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      micOn = false; updateMic();
      elMic.classList.add('err');
      elMic.querySelector('.lbl').textContent = 'mic blocked';
    }else if(e.error === 'audio-capture'){
      micOn = false; updateMic();
      elMic.classList.add('err');
      elMic.querySelector('.lbl').textContent = 'no microphone';
    }else if(e.error === 'network'){
      elMic.querySelector('.lbl').textContent = 'listening (no connection…)';
    }
    // no-speech / aborted fall through to onend's restart
  };
  try{ rec.start(); }catch(err){}
}

if(!SRCls){
  elMic.style.display = 'none';
}else{
  elMic.addEventListener('click', () => {
    if(elMic.classList.contains('err')) return;
    micOn = !micOn;
    if(micOn) startRec();
    else if(rec) rec.stop();   // let the pen finish what was already said
    updateMic();
  });
  updateMic();
}

/* ============================== REPLAY ================================ */

let replayTimers = [];
function stopReplay(){
  replayTimers.forEach(clearTimeout);
  replayTimers = [];
  replaying = false;
  stopLivePool();
  document.getElementById('btnReplay').textContent = 'Replay';
}
function replay(){
  if(replaying){ stopReplay(); relayout(); return; }
  const evs = Timeline.events;
  if(!evs.length) return;
  replaying = true;
  selection = null;
  stopLivePool();
  document.getElementById('btnReplay').textContent = 'Stop';
  elCap.classList.remove('show');

  // honour the original rhythm, but never make the viewer wait more than 3s
  let acc = 0, prev = evs[0].t;
  const schedule = [];
  for(let i=0;i<evs.length;i++){
    acc += Math.min(evs[i].t - prev, REPLAY_GAP_CAP);
    prev = evs[i].t;
    schedule.push(acc);
  }
  // Replay renders through CURRENT settings — that's the whole point of it.
  // We pass a synthetic `nowT` so pools appear exactly as they will at rest.
  render(layout([], {nowT:0}));
  for(let i=0;i<evs.length;i++){
    replayTimers.push(setTimeout(()=>{
      // a replay re-performs the writing: each letter is drawn as it lands
      pendingEntrance = (evs[i].type === 'char');
      render(layout(evs.slice(0, i+1), { nowT: evs[i].t }));
      if(i === evs.length-1){ stopReplay(); relayout(); touched(); }
    }, schedule[i] + 220));
  }
}

/* ============================== EXPORT ================================ */

function makeGrainTile(){
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const img = g.createImageData(128,128);
  for(let i=0;i<img.data.length;i+=4){
    const v = 128 + (Math.random()-0.5)*255;
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = 14;
  }
  g.putImageData(img,0,0);
  return c;
}

async function savePage(){
  await document.fonts.ready;
  const m = layout(Timeline.events, {});
  const DPR = 2;
  const PADX = 68;
  const W = COL_W + PADX*2;
  const H = Math.max(m.height, 520);
  const c = document.createElement('canvas');
  c.width = W*DPR; c.height = H*DPR;
  const x = c.getContext('2d');
  x.scale(DPR, DPR);

  // paper
  x.fillStyle = '#f5f1e8'; x.fillRect(0,0,W,H);
  const warm = x.createRadialGradient(W/2, 0, 0, W/2, 0, H*1.1);
  warm.addColorStop(0,'rgba(255,253,247,0.55)');
  warm.addColorStop(1,'rgba(224,216,200,0.45)');
  x.fillStyle = warm; x.fillRect(0,0,W,H);
  const pat = x.createPattern(makeGrainTile(), 'repeat');
  x.globalAlpha = 0.5; x.fillStyle = pat; x.fillRect(0,0,W,H); x.globalAlpha = 1;

  x.save();
  x.translate(PADX, 0);
  x.textBaseline = 'alphabetic';

  const drawGlyph = g => {
    if(g.ch === ' ' || g.ch === '\n') return;
    if(g.pool > 0){
      const r = g.size * (0.16 + g.pool * 0.42 * S.poolBleed);
      const f = poolFade(g.pool);
      const c = blotCenter(g);
      const rg = x.createRadialGradient(c.cx, c.cy, 0, c.cx, c.cy, r);
      rg.addColorStop(0,   'rgba(28,26,23,'+(0.30*S.poolDark*f).toFixed(3)+')');
      rg.addColorStop(0.38,'rgba(28,26,23,'+(0.13*S.poolDark*f).toFixed(3)+')');
      rg.addColorStop(0.72,'rgba(28,26,23,0)');
      x.fillStyle = rg;
      x.beginPath(); x.arc(c.cx, c.cy, r, 0, Math.PI*2); x.fill();
    }
    // The DOM shears each glyph about its box's bottom-centre
    // (transform-origin:50% 100%), NOT about the baseline — with line-height:1
    // the box bottom sits size*(1-top) below it. Word-uniform lean means that
    // offset is constant across a word, so getting it wrong would slide whole
    // words sideways relative to the screen. Mirror the origin exactly, using
    // this glyph's own resolved face.
    const gw = charW(g.font, g.ch) * g.size;
    const dy = g.size * (1 - g.topK);
    x.save();
    x.translate(g.x + gw/2, g.y + g.jitter + dy);
    if(g.skew) x.transform(1, 0, Math.tan(g.skew * Math.PI/180), 1, 0, 0);
    if(g.rot) x.rotate(g.rot * Math.PI/180);
    x.translate(-gw/2, -dy);
    // Export mirrors the DOM: no edge-fade knockout, no blur — plain ink.
    x.font = g.size.toFixed(2)+'px '+fontStack(g.font);
    x.globalAlpha = g.opacity;
    x.fillStyle = g.color;
    x.fillText(g.ch, 0, 0);
    x.restore();
  };

  m.main.forEach(drawGlyph);
  for(const r of m.revisions){
    r.glyphs.forEach(drawGlyph);
    x.save();
    x.globalAlpha = 0.72 * (r.struck ? S.ghostOp : 1);
    x.fillStyle = mixColor(0.8);
    x.font = r.markSize.toFixed(2)+'px '+fontStack(m.reprFont);
    x.fillText('∧', r.markX - r.markSize*0.34, r.markY);
    x.restore();
  }
  // strikes
  x.strokeStyle = mixColor(0.55);
  x.globalAlpha = STRIKE_OP;
  x.lineCap = 'round';
  for(const s of m.strikes){
    x.lineWidth = s.w;
    const len = Math.max(6, s.x1 - s.x0);
    const steps = Math.max(3, Math.round(len/14));
    x.beginPath();
    for(let i=0;i<=steps;i++){
      const t = i/steps;
      const px = s.x0 + len*t;
      const py = s.y + Math.sin(t*Math.PI*1.7 + s.seed)*0.9*(0.35+0.65*Math.sin(t*Math.PI)) + rnd(s.seed*31+i,5)*0.35;
      i ? x.lineTo(px,py) : x.moveTo(px,py);
    }
    x.stroke();
  }
  x.globalAlpha = 1;
  x.restore();

  // caption
  x.textAlign = 'center';
  x.fillStyle = mixColor(0.15);
  x.globalAlpha = 0.62;
  const cs = m.reprBase * 0.42;
  x.font = cs.toFixed(2)+'px '+fontStack(m.reprFont);
  x.fillText(captionText(m), W/2, H - 74);
  x.globalAlpha = 0.45;
  x.font = (cs*0.78).toFixed(2)+'px '+fontStack(m.reprFont);
  x.fillText(dateText(), W/2, H - 74 + cs*1.6);
  x.globalAlpha = 1;

  c.toBlob(b => {
    const url = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pen-and-paper-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.png';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, 'image/png');
}

/* ============================ CONTROL PANEL =========================== */

const elPanel = document.getElementById('panel');
function togglePanel(){ elPanel.classList.toggle('on'); }

(function buildPanel(){
  const host = document.getElementById('controls');
  for(const s of SPEC){
    if(s.type === 'select'){
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = '<label><span>'+s.label+'</span></label>';
      const sel = document.createElement('select');
      FONTS.forEach(f=>{
        const o = document.createElement('option');
        o.value = f.id; o.textContent = f.label;
        if(S[s.key] === f.id) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = async () => {
        S[s.key] = sel.value; saveSettings();
        flushMeasureCache();
        try{ await document.fonts.load('28px "'+sel.value+'"'); }catch(e){}
        await document.fonts.ready;
        flushMeasureCache();
        relayout();
      };
      row.appendChild(sel); host.appendChild(row);
    }
    else if(s.type === 'range'){
      const row = document.createElement('div'); row.className = 'row';
      const out = document.createElement('span'); out.className = 'val';
      out.textContent = s.fmt(S[s.key]);
      const lab = document.createElement('label');
      lab.innerHTML = '<span>'+s.label+'</span>';
      lab.appendChild(out);
      const inp = document.createElement('input');
      inp.type='range'; inp.min=s.min; inp.max=s.max; inp.step=s.step; inp.value=S[s.key];
      inp.oninput = () => {
        S[s.key] = parseFloat(inp.value);
        out.textContent = s.fmt(S[s.key]);
        saveSettings();
        if(!replaying) relayout();
      };
      row.appendChild(lab); row.appendChild(inp); host.appendChild(row);
    }
    else if(s.type === 'toggle'){
      const l = document.createElement('label'); l.className = 'tog';
      const inp = document.createElement('input'); inp.type='checkbox'; inp.checked = !!S[s.key];
      inp.onchange = () => { S[s.key] = inp.checked; saveSettings(); if(!replaying) relayout(); };
      l.appendChild(inp);
      l.appendChild(document.createTextNode(s.label));
      host.appendChild(l);
    }
  }
})();

document.getElementById('btnReplay').onclick = replay;
document.getElementById('btnSave').onclick   = savePage;
document.getElementById('btnClear').onclick  = () => {
  stopReplay();
  stopLivePool();
  flushVoice();
  Timeline.clear();
  selection = null; firstKeyDone = false;
  elPh.style.opacity = '';
  elCap.classList.remove('show');
  relayout();
};
elPanel.addEventListener('mousedown', e => e.stopPropagation());

/* ============================== BOOT ================================== */

(async function boot(){
  relayout();                       // fallback metrics, so nothing flashes empty
  try{
    await Promise.all(FONTS.map(f => document.fonts.load('28px "'+f.id+'"')));
  }catch(e){}
  await document.fonts.ready;
  flushMeasureCache();
  relayout();
  scheduleIdleCaption();
})();
</script>
</body>
</html>
