<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pen &amp; Paper</title>
<link rel="icon" type="image/png" href="/favicon-darkbg.png">
<link rel="apple-touch-icon" href="/favicon-darkbg.png">
<meta name="description" content="A page that records how you wrote, not just what. Type slowly and the hand stays careful; type fast and it runs into cursive.">
<meta property="og:title" content="Pen &amp; Paper">
<meta property="og:description" content="We digitized the words and lost the writing. This page keeps it.">

<style>
  :root{
    --paper:#f5f1e8;
    --graphite:#6b6560;
    --ink:#1c1a17;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    overflow-y:auto;
    overflow-x:hidden;
    cursor:text;
    -webkit-font-smoothing:antialiased;
  }
  /* paper grain */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    z-index:0;
    opacity:.055;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
    background-size:240px 240px;
  }
  /* a barely-there warmth gradient so the paper isn't dead flat */
  body::after{
    content:"";
    position:fixed; inset:0;
    pointer-events:none; z-index:0;
    background:radial-gradient(120% 90% at 50% 0%, rgba(255,253,247,.55), rgba(233,226,212,.35) 70%, rgba(224,216,200,.5) 100%);
  }

  #stage{position:relative; z-index:1; width:100%;}
  #page{
    position:relative;
    width:640px;
    margin:0 auto;
    min-height:100vh;
  }
  #glyphs{position:absolute; inset:0;}
  #strikes{position:absolute; left:0; top:0; overflow:visible; pointer-events:none;}
  .g{
    position:absolute;
    line-height:1;
    white-space:pre;
    transform-origin:50% 100%;
    user-select:none;
    cursor:text;
    /* NO will-change here. It promotes every glyph to its own composited
       layer, and the layer is rasterized to the element's box — but these
       hands draw far outside theirs (line-height:1, ascenders and flourishes
       climbing well past the em box), so promotion shears the tops off every
       tall letter. Transforms here are static per glyph, not animated, so the
       hint bought nothing; dropping it also avoids a layer per character. */
  }
  .g.click{cursor:pointer}
  /* the ink itself: an svg filled with currentColor. overflow:visible and
     no mask/filter anywhere - the ink is free to leave its box (ascenders,
     wobble, drag-traces reaching back to the previous letter). */
  svg.gi{ position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; display:block; }
  /* NO masks and NO filters anywhere on glyphs. Both rasterize the element
     into its own layer sized to the element's box, and these hands draw far
     outside their box — every mask/filter variant we tried ended up shearing
     ascenders at some size or during some frame of animation. The entrance
     is a plain opacity fade: quick enough to read as the ink landing, with
     nothing that can clip. */
  @keyframes penstroke{
    0%  { opacity:0; }
    100%{ opacity:1; }
  }
  .gi.reveal{
    animation:penstroke var(--rd,140ms) ease-out backwards;
  }
  @media (prefers-reduced-motion:reduce){
    .gi.reveal{ animation:none; }
  }
  .selunder{
    position:absolute;
    height:1px;
    background:var(--graphite);
    opacity:.55;
    pointer-events:none;
  }
  #caret{
    position:absolute;
    width:1.5px;
    background:var(--ink);
    opacity:.85;
    pointer-events:none;
    animation:blink 1.1s steps(1,end) infinite;
  }
  @keyframes blink{0%,55%{opacity:.85}56%,100%{opacity:0}}
  #placeholder{
    position:absolute;
    color:var(--graphite);
    opacity:.30;
    pointer-events:none;
    line-height:1;
    white-space:pre;
    transition:opacity .5s ease;
  }
  #caption{
    position:absolute;
    left:0; width:100%;
    text-align:center;
    color:var(--graphite);
    opacity:0;
    transition:opacity 1.4s ease;
    pointer-events:none;
    line-height:1.5;
  }
  #caption.show{opacity:.5}
  #caption .d{font-size:.62em; opacity:.75}

  #hidden{
    position:fixed; left:-9999px; top:0; width:1px; height:1px;
    opacity:0; border:0; padding:0; resize:none;
  }

  #panel{
    position:fixed; right:22px; top:22px; z-index:50;
    width:268px;
    background:rgba(247,244,236,.93);
    backdrop-filter:blur(8px);
    border:1px solid rgba(107,101,96,.22);
    border-radius:3px;
    box-shadow:0 6px 26px rgba(60,54,44,.10);
    padding:14px 14px 12px;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    font-size:10.5px;
    color:#4b4640;
    display:none;
    max-height:calc(100vh - 44px);
    overflow-y:auto;
    cursor:default;
  }
  #panel.on{display:block}
  #panel h4{
    margin:0 0 10px; font-size:9px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; color:#8d867d;
  }
  #panel .hint{font-size:9px;color:#9a938a;margin:-6px 0 12px;letter-spacing:.02em}
  #panel .row{margin-bottom:9px}
  #panel label{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px; letter-spacing:.01em}
  #panel .val{color:#8d867d; font-variant-numeric:tabular-nums; font-size:9.5px}
  #panel select{
    width:100%; font-family:inherit; font-size:10.5px; padding:4px 5px;
    background:rgba(255,255,255,.6); color:#3d3934;
    border:1px solid rgba(107,101,96,.25); border-radius:2px; outline:none;
  }
  #panel input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:14px; background:transparent; outline:none; margin:0;
  }
  #panel input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(107,101,96,.35)}
  #panel input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:9px;height:9px;border-radius:50%;
    background:#5c564f; margin-top:-4px; cursor:pointer;
  }
  #panel input[type=range]::-moz-range-track{height:1px;background:rgba(107,101,96,.35)}
  #panel input[type=range]::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:#5c564f;cursor:pointer}
  #panel .tog{display:flex;justify-content:flex-start;align-items:center;gap:7px;margin-bottom:7px;cursor:pointer;user-select:none}
  #panel .tog input{accent-color:#5c564f;margin:0;cursor:pointer}
  #panel .sep{height:1px;background:rgba(107,101,96,.16);margin:12px 0 11px}
  #panel .btns{display:flex;gap:6px;flex-wrap:wrap}
  #panel button{
    flex:1 1 auto; font-family:inherit; font-size:10px; letter-spacing:.02em;
    padding:6px 8px; background:rgba(255,255,255,.5); color:#4b4640;
    border:1px solid rgba(107,101,96,.28); border-radius:2px; cursor:pointer;
    transition:background .15s;
  }
  #panel button:hover{background:rgba(255,255,255,.9)}
  #panel button:disabled{opacity:.4;cursor:default}
</style>

<script>
"use strict";
/* =========================================================================
   PEN & PAPER
   A typing surface where letterforms record the process of writing.

   Three layers, one code path:
     Timeline  — the raw record of what happened (events + timestamps)
     Layout    — (timeline + settings) -> positioned, styled glyphs
     Renderer  — glyphs -> DOM (and, for export, -> canvas)

   Replay, font switching, resizing and slider changes ALL just re-run
   Layout + Render over the timeline. Nothing is stored in the DOM.
   ========================================================================= */

/* ------------------------------ constants ------------------------------ */

const GRAPHITE = [0x6b, 0x65, 0x60];
const INK      = [0x1c, 0x1a, 0x17];
const COL_W    = 640;          // writing column width
const PAD_TOP  = 132;          // top of page padding
const PAD_BOT  = 180;
const FAST_MS  = 70;           // dt considered "fast"
const SLOW_MS  = 620;          // dt considered "deliberate"
const DT_CAP   = 1400;         // dt above this doesn't loosen the hand further
// The hand stays PERFECTLY regular until the pen is genuinely moving, then
// breaks down fast. SCRAP_KNEE is that threshold on the 0..1 pace scale:
// 0.62 lands at roughly 160ms/char, so deliberate and ordinary typing both
// render dead-straight and even, and only a real burst goes messy. Below the
// knee scrap is exactly 0 — not merely small — which is what makes the slow
// end read as 规整 rather than slightly-wobbly.
const SCRAP_KNEE  = 0.30;
const STRIKE_OP = 1;           // the strike is a mark of its own, not a ghost — full ink
const IDLE_CAP = 10000;        // ms of stillness before the caption fades in
const REPLAY_GAP_CAP = 3000;

/* The hand's join floor: the tracking, in em, at which drag-traces from one
   letter reach the next comfortably. Slightly negative - a rushed hand
   crowds its letters. */
const SPREAD_CAP = 0.046;

/* ------------------------------ settings ------------------------------- */

const SPEC = [
  { key:'baseSize',    type:'range',  label:'Size',              def:28,   min:20,  max:40,  step:1,    fmt:v=>v+'px' },
  { key:'weight',      type:'range',  label:'Weight',            def:0.050,min:0.03,max:0.10, step:0.002,fmt:v=>v.toFixed(3) },
  { key:'scrapAmt',    type:'range',  label:'Scrappiness',       def:1.0,  min:0,   max:2,   step:0.05, fmt:v=>v.toFixed(2) },
  { key:'letterSpread',type:'range',  label:'Letter spread',     def:1.0,  min:0,   max:2,   step:0.05, fmt:v=>v.toFixed(2) },
  { key:'ghostOp',     type:'range',  label:'Ghost opacity',     def:1.0,  min:0.3, max:1,   step:0.01, fmt:v=>v.toFixed(2) },
  { key:'wobbleAmt',   type:'range',  label:'Wobble amount',     def:1.0,  min:0,   max:2.5, step:0.05, fmt:v=>v.toFixed(2) },
  { key:'wobbleOn',    type:'toggle', label:'Rhythm wobble',     def:true },
];

const S = {};
SPEC.forEach(s => S[s.key] = s.def);

// v8: elegance pass - smaller x-height, taller extenders, more slant,
// spindlier default weight, no trailing pool.
const LS_KEY = 'pen-and-paper/settings/v8';
function loadSettings(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const o = JSON.parse(raw);
    SPEC.forEach(s => { if(o[s.key] !== undefined) S[s.key] = o[s.key]; });
  }catch(e){ /* first run, or storage blocked */ }
}
function saveSettings(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}
loadSettings();

/* --------------------------- deterministic noise ----------------------- */
// Layout must be reproducible: the same timeline + settings must always
// produce the same wobble, or resizing/font-switching would reshuffle ink.
function hash(n, salt){
  const x = Math.sin(n * 127.1 + (salt||0) * 311.7 + 74.7) * 43758.5453;
  return x - Math.floor(x);
}
const rnd = (n,salt) => hash(n,salt) * 2 - 1;   // -1..1

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
function mixColor(t){                            // graphite -> ink
  const c = GRAPHITE.map((g,i)=> Math.round(lerp(g, INK[i], t)));
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
}

/* ============================== TIMELINE ==============================
   Events are the single source of truth. Types:
     char      {ch, t}          a character at the current writing position
     back      {t}              a backspace
     revstart  {anchor, t}      begin a revision over the word at `anchor`
     revcommit {t}              accept the pending revision
     revcancel {t}              discard it
     revstrike {anchor, t}      strike an existing floating revision (2-layer cap)
   ====================================================================== */

const Timeline = {
  events: [],
  push(e){ this.events.push(e); },
  clear(){ this.events.length = 0; },
  first(){ return this.events.length ? this.events[0].t : 0; },
  last(){ return this.events.length ? this.events[this.events.length-1].t : 0; },
};

/* =============================== THE HAND ==============================
   The letterforms themselves. Not a font: each glyph is the path a pen
   travels (a skeleton), rendered at draw time as variable-width ink. Speed
   (g.scrap) deforms the geometry itself:
     0  careful print - crisp corners, even directional pressure, dots
        are pressed dots, crossbars sit where they should
     1  rushed hand - corners cut, pressure light and patchy, dots smear
        into flicks that land late, crossbars drift, and faint drag-traces
        join letters where the pen never fully lifted
   Coordinates: x-height = 1, baseline y = 0, y up. Ascender ~1.5,
   caps 1.45, descender ~-0.5. A point is [x,y] or [x,y,1] (sharp corner).
   ======================================================================= */

const XH     = 0.37;   // x-height as a fraction of font size - small on
                       // purpose: elegant hands keep the x-height modest
                       // and let ascenders carry the height
const TOP_K  = 0.72;   // glyph box top above baseline, fraction of size
const DESC_K = 0.28;   // glyph box bottom below baseline
const SIDE   = 0.062;  // sidebearing, em
const HAND_SLANT = 8.5; // baked-in slant, deg - word lean stacks on top
const CURSIVE_KNEE = 0.45; // word mean scrap past which a word writes cursive
const JOIN_REACH   = 1.0;  // sanity cap on a connector's length, em

const harc = (cx, cy, r, a0, a1, n = 10, ry) => {
  ry = ry === undefined ? r : ry;
  const o = [];
  for(let i = 0; i <= n; i++){
    const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
    o.push([cx + r * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return o;
};

/* The maturing pass: Eric's own hand is narrow and slanted with tall
   ascenders - the first draft read as child writing because it was round,
   upright and wide. Rather than re-author every skeleton, squash x by 0.88
   and stretch the extender zones (ascenders x1.5 above the x-height,
   descenders x1.3 below the baseline) once at init. Anchors and advances
   come along, so joins and spacing stay exact. */
(function matureHand(){
  const fy = y => y > 1 ? 1 + (y - 1) * 1.6 : (y < 0 ? y * 1.4 : y);
  const fp = p => { p[0] *= 0.88; p[1] = fy(p[1]); };
  // the cursive set shares the extender stretch but NOT the narrowing -
  // the opposite: cursive bodies must be generous and round (narrowed, the
  // bowls collapsed into pencil-thin blobs). Entries/exits scale along.
  const fpc = pt => { pt[0] *= 1.18; pt[1] = fy(pt[1]); };
  for(const k in CURSIVE_GLYPHS){
    const g = CURSIVE_GLYPHS[k];
    g.adv *= 1.18;
    fpc(g.ent); fpc(g.ext);
    for(const st of g.strokes) for(const pt of st.pts) fpc(pt);
  }
  for(const k in HAND_GLYPHS){
    const g = HAND_GLYPHS[k];
    g.adv *= 0.88;
    if(g.ent) fp(g.ent);
    if(g.ext) fp(g.ext);
    for(const st of g.strokes) for(const pt of st.pts) fp(pt);
    // the CURSIVE entry: where a connector running along the baseline meets
    // this letter - its leftmost low point (a stem's foot, a bowl's bottom
    // left), NOT the print entry (h prints from the ascender top; no pen
    // joins a letter up there). Computed after the remap so it lives in
    // final coordinates like ent/ext.
    let best = null;
    for(const st of g.strokes){
      if(st.kind) continue;
      for(const pt of st.pts){
        if(pt[1] > 0.60 || pt[1] < -0.18) continue;
        if(!best || pt[0] < best[0]) best = pt;
      }
    }
    g.centr = best ? [best[0], best[1]] : (g.ent ? [g.ent[0], g.ent[1]] : null);
  }
})();

// anything the alphabet doesn't cover renders as a short baseline dash -
// visibly "a mark was made here", never an invisible hole
const HAND_FALLBACK = { adv:.44, strokes:[ { pts: [[.06,.38],[.36,.42]] } ]};
const handDef = ch => HAND_GLYPHS[ch] || HAND_FALLBACK;

/* skeleton -> smoothed centerline. cornerCut in [0,1]: sharp corners are
   honored at 0 (point doubled so the spline turns hard) and shortcut as
   the hand speeds up. */
function centerline(pts, cornerCut, samplesPer){
  const P = [];
  for(let i = 0; i < pts.length; i++){
    const p = pts[i];
    if(p[2] === 1 && i > 0 && i < pts.length - 1){
      const a = pts[i-1], b = pts[i+1];
      const t = 0.04 + cornerCut * 0.22;
      P.push([p[0] + (a[0]-p[0])*t, p[1] + (a[1]-p[1])*t]);
      P.push([p[0] + (b[0]-p[0])*t, p[1] + (b[1]-p[1])*t]);
    } else P.push([p[0], p[1]]);
  }
  if(P.length === 1) return [P[0], [P[0][0]+.02, P[0][1]]];
  const out = [];
  const n = P.length;
  const get = i => P[Math.max(0, Math.min(n-1, i))];
  for(let i = 0; i < n - 1; i++){
    const p0 = get(i-1), p1 = get(i), p2 = get(i+1), p3 = get(i+2);
    const seg = Math.max(2, Math.round(samplesPer *
      Math.hypot(p2[0]-p1[0], p2[1]-p1[1]) * 2 + 2));
    for(let j = 0; j < seg; j++){
      const t = j / seg, t2 = t*t, t3 = t2*t;
      out.push([
        0.5*((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        0.5*((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3),
      ]);
    }
  }
  out.push([P[n-1][0], P[n-1][1]]);
  return out;
}

/* centerline + per-sample widths -> one filled outline path ("d" string).
   Self-intersections at retraces just fill darker - like real ink. */
function inkPath(line, widths){
  const n = line.length;
  if(n < 2) return '';
  const L = [], R = [];
  let px = 0, py = -1;
  for(let i = 0; i < n; i++){
    const a = line[Math.max(0, i-1)], b = line[Math.min(n-1, i+1)];
    let dx = b[0]-a[0], dy = b[1]-a[1];
    const m = Math.hypot(dx, dy);
    if(m > 1e-6){ px = -dy/m; py = dx/m; }
    const w = widths[i] / 2;
    L.push([line[i][0] + px*w, line[i][1] + py*w]);
    R.push([line[i][0] - px*w, line[i][1] - py*w]);
  }
  const f = p => p[0].toFixed(2) + ' ' + p[1].toFixed(2);
  let d = 'M' + f(L[0]);
  for(let i = 1; i < n; i++) d += 'L' + f(L[i]);
  for(let i = n-1; i >= 0; i--) d += 'L' + f(R[i]);
  return d + 'Z';
}

/* handGlyph(ch, o) -> array of {d} path descriptors in glyph-local px:
   origin at the baseline-left, y down (screen space).
   o: { size, scrap, seed, wobble, weight } */
// the def a glyph actually renders with: cursive construction when the
// word flows and the letter has a cursive form; print otherwise
function handDefFor(ch, cursive){
  return (cursive && CURSIVE_GLYPHS[ch]) || handDef(ch);
}

function handGlyph(ch, o){
  const def = handDefFor(ch, o.cursive);
  const K = o.size * XH;               // skeleton unit -> px
  const slantTan = Math.tan(HAND_SLANT * Math.PI / 180);
  const paths = [];
  const baseW = o.weight * o.size;     // stroke width, px

  def.strokes.forEach((st, si) => {
    let pts = st.pts;
    const seed = o.seed * 31 + si * 7;

    // when this glyph is joined (o.joinIn / o.joinOut), the stroke end the
    // connector meets must NOT taper to a point - the seam has to flow
    // through, not pinch. The join-in lands on the cursive entry (centr),
    // the join-out leaves from ext; blunt whichever stroke end sits there.
    const jAnchors = [];
    // cursive joins land on the authored entry; print fallbacks (caps,
    // digits inside a flowing word) are met at their low point
    const inAnchor = o.cursive && CURSIVE_GLYPHS[ch] ? def.ent : (def.centr || def.ent);
    if(o.joinIn  && inAnchor) jAnchors.push(inAnchor);
    if(o.joinOut && def.ext) jAnchors.push(def.ext);
    const nearJoin = pt => jAnchors.some(a2 =>
      Math.hypot(pt[0] - a2[0], pt[1] - a2[1]) < 0.15);
    const bluntStart = st.kind === undefined && jAnchors.length && nearJoin(pts[0]);
    const bluntEnd   = st.kind === undefined && jAnchors.length && nearJoin(pts[pts.length-1]);

    if(st.kind === 'dot'){
      // a dot is a press of the pen: a blob slightly wider than the stroke.
      // hurried, it lands late (to the right), high, and smears into a flick.
      const dx = o.scrap * (0.20 + 0.22 * Math.abs(rnd(seed, 1)));
      const dy = o.scrap * 0.14 * rnd(seed, 2);
      const cx0 = pts[0][0] + dx, cy0 = pts[0][1] + dy;
      const r = (baseW / K) * (0.48 + 0.08 * rnd(seed, 3)) * (1 - o.scrap * 0.25);
      const cx = (cx0 + cy0 * slantTan) * K, cy = -cy0 * K, rp = r * K;
      let d = 'M' + (cx-rp).toFixed(2) + ' ' + cy.toFixed(2) +
              'A' + rp.toFixed(2) + ' ' + rp.toFixed(2) + ' 0 1 0 ' + (cx+rp).toFixed(2) + ' ' + cy.toFixed(2) +
              'A' + rp.toFixed(2) + ' ' + rp.toFixed(2) + ' 0 1 0 ' + (cx-rp).toFixed(2) + ' ' + cy.toFixed(2) + 'Z';
      if(o.scrap > 0.3){
        const len = (o.scrap - 0.3) * 0.5, ang = 0.2 + rnd(seed, 4) * 0.5;
        const ex = cx0 + len * Math.cos(ang), ey = cy0 + len * Math.sin(ang) * 0.4;
        d += inkPath([[cx, cy], [(ex + ey*slantTan) * K, -ey * K]], [rp * 1.2, rp * 0.3]);
      }
      paths.push({ d });
      return;
    }
    if(st.kind === 'bar'){
      // crossbars drift right and tilt when rushed
      const dx = o.scrap * 0.14 * (1 + rnd(seed, 3));
      const tilt = o.scrap * 0.12 * rnd(seed, 4);
      pts = pts.map((p, i) => [p[0] + dx, p[1] + (i === pts.length-1 ? tilt : 0)]);
    }

    // cursive keeps its corners: a cursive z's zigzag IS the letter, so
    // speed barely cuts it. Print corners still round off with hurry.
    const line = centerline(pts, o.cursive ? o.scrap * 0.35 : o.scrap, 9);
    const N = line.length;

    // THE MELT. Past mid-speed the letterforms themselves relax: an
    // endpoint-preserving smoothing pass pulls articulation toward gesture,
    // so an s flattens toward a wave and arches go shallow - the way a real
    // hand degrades into cursive, instead of printing faster. Runs before
    // widths/wobble so the ink follows the melted geometry.
    // cursive forms are already fluid - melting them back into mush is the
    // exact mistake this construction replaces. They relax only at extreme
    // speed, and mildly. Print keeps its old ramp (moot in practice: print
    // words sit below CURSIVE_KNEE).
    const melt = o.cursive
      ? Math.max(0, (o.scrap - 0.78) / 0.22) * 0.5
      : Math.max(0, (o.scrap - 0.55) / 0.45);
    // one pass ALWAYS runs: it rounds off the faint polyline stiffness that
    // made even the careful hand read young. Deliberate sharp corners
    // survive it (their doubled points keep the spline turning hard).
    const passes = 1 + Math.round(melt * (o.cursive ? 4 : 7));
    for(let pass = 0; pass < passes; pass++){
      for(let i = 1; i < N - 1; i++){
        line[i][0] = line[i][0] * 0.5 + (line[i-1][0] + line[i+1][0]) * 0.25;
        line[i][1] = line[i][1] * 0.5 + (line[i-1][1] + line[i+1][1]) * 0.25;
      }
    }

    let arcLen = 0;
    const al = [0];
    for(let i = 1; i < N; i++){
      arcLen += Math.hypot(line[i][0]-line[i-1][0], line[i][1]-line[i-1][1]);
      al.push(arcLen);
    }
    const widths = [];
    const f1 = 5 + Math.abs(rnd(seed, 5)) * 3, f2 = 11 + Math.abs(rnd(seed, 6)) * 5;
    const ph1 = rnd(seed, 7) * 7, ph2 = rnd(seed, 8) * 7;
    const wob = (o.wobble || 0) * (0.006 + o.scrap * 0.020);
    const wf1 = 3.2 + Math.abs(rnd(seed, 9)) * 2;
    const wph = rnd(seed, 10) * 7;
    // a careful pen lifts cleanly (blunt ends); a rushed one flicks -
    // unless the end is joined, in which case it doesn't end at all
    const tIn = 0.035 + o.scrap * 0.10, tOut = 0.045 + o.scrap * 0.13;
    // directional pressure: downstrokes press, upstrokes and horizontals
    // glide. This is what separates a pen from a felt-tip. Contrast relaxes
    // as the hand speeds up - a rushed hand doesn't modulate pressure.
    const press = 0.42 * (1 - o.scrap * 0.35);

    for(let i = 0; i < N; i++){
      const t = arcLen > 0 ? al[i] / arcLen : 0;
      const taper = Math.min(1, bluntStart ? 1 : t / tIn, bluntEnd ? 1 : (1 - t) / tOut);
      const tp = Math.max(0.10, Math.pow(Math.max(taper, 0), 0.55));
      const a2 = line[Math.max(0, i-1)], b2 = line[Math.min(N-1, i+1)];
      const tdx = b2[0]-a2[0], tdy = b2[1]-a2[1], tm = Math.hypot(tdx, tdy) || 1;
      const down = Math.max(0, -tdy / tm);
      const dir = 1 - press * 0.55 + press * down;
      // ink WEIGHT stays roughly constant across the spectrum (Eric,
      // 2026-08-24) - speed shows in geometry, only faintly in ink. Patch
      // depth is mild and there is no overall speed lightening any more.
      const patch = 1 - o.scrap * 0.13 * (0.5 + 0.5 * Math.sin(al[i] * f1 + ph1))
                      - o.scrap * 0.07 * (0.5 + 0.5 * Math.sin(al[i] * f2 + ph2));
      widths.push(baseW / K * tp * dir * Math.max(0.60, patch));
      const dn = wob * Math.sin(al[i] * wf1 + wph) + wob * 0.5 * rnd(seed, 20 + i) * o.scrap;
      const na = line[Math.max(0, i-1)], nb = line[Math.min(N-1, i+1)];
      const ndx = nb[0]-na[0], ndy = nb[1]-na[1], nm = Math.hypot(ndx, ndy) || 1;
      line[i][0] += (-ndy/nm) * dn;
      line[i][1] += ( ndx/nm) * dn;
    }

    const px = line.map(p => [ (p[0] + p[1]*slantTan) * K, -p[1] * K ]);
    const wpx = widths.map(w => w * K);
    paths.push({ d: inkPath(px, wpx) });
  });
  return paths;
}

// glyph-local px of a skeleton anchor point (ent/ext), for drag-traces
function handAnchor(pt, size){
  const K = size * XH;
  const slantTan = Math.tan(HAND_SLANT * Math.PI / 180);
  return [ (pt[0] + pt[1]*slantTan) * K, -pt[1] * K ];
}

// the connector a hurrying pen writes instead of lifting. Real cursive
// connectors are underturns: they dip toward the baseline between letters
// and rise into the next entry, in solid ink (an upstroke, not a ghost).
function joinPath(x1, y1, x2, y2, sag, seed){
  const mx = (x1+x2)/2, my = Math.max(y1, y2) + sag;
  return 'M' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
         ' Q' + (mx + rnd(seed,1)*2).toFixed(1) + ' ' + (my + rnd(seed,2)*2).toFixed(1) +
         ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1);
}

/* Does the pen join pv -> g? One shared gate for the DOM, the export and
   the taper logic, so ink, blunt ends and connectors always agree.
   Coordinates come back in g's local frame (word-uniform transforms make
   the previous letter a plain x offset there). w is the join's ramp 0..1:
   connectors fade in just past the knee and are solid ink soon after. */
function joinInfo(pv, g){
  if(!pv || !g) return null;
  // joins exist only between letters of a flowing (cursive-mode) word -
  // print never fakes them any more
  if(!pv.cursive || !g.cursive) return null;
  if(pv.ch === ' ' || pv.ch === '\n' || g.ch === ' ' || g.ch === '\n') return null;
  if(pv.line !== g.line || pv.struck !== g.struck) return null;
  const A = handDefFor(pv.ch, true), B = handDefFor(g.ch, true);
  if(!A.ext || !B.ent) return null;
  // a print-form letter inside a cursive word (caps, digits) is met at its
  // low point, not its print entry
  const target = CURSIVE_GLYPHS[g.ch] ? B.ent : (B.centr || B.ent);
  const a = handAnchor(A.ext, pv.size), b = handAnchor(target, g.size);
  const ax = a[0] + (pv.x - g.x), ay = a[1];
  const gap = Math.hypot(b[0] - ax, b[1] - ay);
  if(gap >= g.size * JOIN_REACH) return null;
  return { ax, ay, bx: b[0], by: b[1], gap, w: 1,
           sag: Math.min(g.size * XH * 0.18, gap * 0.28) };
}
// the connector's ink: solid quickly (an upstroke is lighter than a
// downstroke but it is still ink, not a pencil ghost)
const joinAlpha = w => Math.min(1, 0.55 + 0.60 * w);
const joinWidth = (size, w) => S.weight * size * (0.55 + 0.25 * w);

/* lay out a short run of engine text (page furniture: placeholder, caption,
   revision caret). Returns {parts:[{d,tx,stroke}], w}: each part is a
   glyph-local path plus its x offset; total width in px. `cursive` picks the
   cursive construction and draws the connectors between its letters, so a
   run of furniture can demonstrate the fast hand and not merely name it. */
function handTextParts(text, size, scrap, seedBase, cursive){
  const parts = [];
  const font = cursive ? 'cursive' : 'hand';
  let x = 0, prevCh = null, prevX = 0;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(ch === ' '){ x += size * 0.30; prevCh = null; continue; }
    if(ch === '\n'){ prevCh = null; continue; }
    const joinIn = !!(cursive && prevCh && CURSIVE_GLYPHS[prevCh] && CURSIVE_GLYPHS[ch]);
    const nx = text[i+1];
    const joinOut = !!(cursive && nx && CURSIVE_GLYPHS[ch] && CURSIVE_GLYPHS[nx]);
    const ps = handGlyph(ch, { size, scrap, seed: seedBase + i, wobble: 0.6,
                               weight: S.weight, cursive, joinIn, joinOut });
    for(const p of ps) parts.push({ d: p.d, tx: x });
    if(joinIn){
      // same geometry as the page's own connectors: prev exit -> this entry,
      // expressed in THIS glyph's local frame (see render()'s emit)
      const A = handDefFor(prevCh, true), B = handDefFor(ch, true);
      const a = handAnchor(A.ext, size), b = handAnchor(B.ent, size);
      const ax = a[0] + (prevX - x), ay = a[1];
      const gap = Math.hypot(b[0] - ax, b[1] - ay);
      if(gap < size * JOIN_REACH){
        parts.push({
          d: joinPath(ax, ay, b[0], b[1], Math.min(size * XH * 0.18, gap * 0.28), seedBase + i),
          tx: x, stroke: joinWidth(size, 1),
        });
      }
    }
    prevCh = ch; prevX = x;
    x += charW(font, ch) * size;
  }
  return { parts, w: x };
}

/* One SVG from several runs, each with its own pace and construction:
   [{text, scrap, cursive}, ...]. The placeholder uses this to SHOW the
   two ends of the speed axis instead of describing them. */
function handRunsSVG(runs, size, seedBase, color){
  let x = 0, inner = '';
  runs.forEach((run, ri) => {
    const r = handTextParts(run.text, size, run.scrap, seedBase + ri * 137, run.cursive);
    for(const p of r.parts){
      inner += '<path d="' + p.d + '" transform="translate(' + (x + p.tx).toFixed(1) + ',0)"' +
        (p.stroke
          ? ' fill="none" stroke="' + (color || 'currentColor') + '" stroke-width="' + p.stroke.toFixed(2) + '" stroke-linecap="round"'
          : ' fill="' + (color || 'currentColor') + '"') + '/>';
    }
    x += r.w;
  });
  const asc = size * TOP_K, desc = size * DESC_K;
  return { svg:
    '<svg width="' + Math.ceil(x + size * 0.3) + '" height="' + Math.ceil(asc + desc) +
    '" style="overflow:visible;display:block">' +
    '<g transform="translate(0,' + asc.toFixed(1) + ')">' + inner + '</g></svg>', w: x };
}
// the same run as an inline SVG string, origin on the left at the baseline
function handTextSVG(text, size, scrap, seedBase, color, opacity){
  const r = handTextParts(text, size, scrap, seedBase);
  const asc = size * TOP_K, desc = size * DESC_K;
  let inner = '';
  for(const p of r.parts)
    inner += '<path d="' + p.d + '" transform="translate(' + p.tx.toFixed(1) + ',0)" fill="' + (color || 'currentColor') + '"/>';
  return { svg:
    '<svg width="' + Math.ceil(r.w + size*0.3) + '" height="' + Math.ceil(asc + desc) +
    '" style="overflow:visible;display:block' + (opacity !== undefined ? ';opacity:' + opacity : '') + '">' +
    '<g transform="translate(0,' + asc.toFixed(1) + ')">' + inner + '</g></svg>', w: r.w };
}

/* ============================== MEASURER ==============================
   Widths and vertical metrics now come from the skeletons, not canvas
   text measurement. Signatures kept so layout() reads the same.
   ====================================================================== */

function fontStack(font){ return '"Inter", sans-serif'; }

// width of one char, per 1px of font-size. 'font' carries the mode:
// 'cursive' reads the cursive set's advances, anything else the print set.
function charW(font, ch){
  if(ch === ' ') return 0.30;
  if(ch === '\n') return 0;
  return handDefFor(ch, font === 'cursive').adv * XH + SIDE;
}

function fontMetrics(font){
  return { asc: TOP_K, desc: DESC_K, lh: (TOP_K + DESC_K) * 1.45, top: TOP_K };
}
function flushMeasureCache(){ /* nothing cached anymore */ }

/* ============================== LAYOUT ================================ */

/**
 * Replay the event list into glyph objects, then position and style them.
 * Pure-ish: same (events, settings, nowT) always yields the same model.
 */
function layout(events, opts){
  opts = opts || {};
  const nowT   = opts.nowT !== undefined ? opts.nowT : Date.now();
  const font   = 'hand';
  // join floor is OPEN (not negative): rushed cursive doesn't crowd its
  // letters - it keeps the distance and writes a connector across it. The
  // underturn needs room to dip, or joins read as ticks instead of flow.
  const face   = { id:'hand', scale:1, join: 0.035 };
  const baseSize = S.baseSize;
  const M = fontMetrics(face.id);
  const ascPx  = M.asc  * baseSize;
  const descPx = M.desc * baseSize;
  const lh      = (ascPx + descPx) * 1.45;
  // a representative face/size for page furniture that isn't "the writing"
  // itself: placeholder, caption, revision caret mark. There's only one
  // face on the page now, so this is just it.
  const reprFont = face.id, reprBase = baseSize, reprM = M;
  // the tracking ceiling this page's Letter spread resolves to — never
  // below the face's own join floor, so the range stays valid at any
  // slider position (see the join-floor doc comment above).
  const cap = Math.max(SPREAD_CAP * S.letterSpread, face.join);

  /* --- pass 1: build the streams from the event tape --- */
  const main = [];              // glyphs written in-line
  const all  = [];              // every glyph in creation order (for timing)
  const revisions = new Map();  // anchor -> {anchor, glyphs, struck, runId}
  let pending = null;           // the revision being composed right now
  let mode = 'append';
  let runId = 0, inBackRun = false;
  let prevT = null;

  function mkGlyph(ch, t, layer){
    const dt = prevT === null ? 900 : Math.max(0, t - prevT);
    prevT = t;
    const g = { ch, t, dt, seq: all.length, layer, struck:false, runId:-1 };
    all.push(g);
    return g;
  }
  function strikeRange(list, from, to, rid){
    for(let i=from;i<to;i++){
      if(!list[i].struck){ list[i].struck = true; list[i].runId = rid; }
    }
  }
  function wordEnd(list, anchor){
    let j = anchor;
    while(j < list.length && list[j].ch !== ' ' && list[j].ch !== '\n') j++;
    return j;
  }

  for(const e of events){
    if(e.type === 'char'){
      if(mode === 'revise'){
        pending.glyphs.push(mkGlyph(e.ch, e.t, 'rev'));
      }else{
        main.push(mkGlyph(e.ch, e.t, 'main'));
        inBackRun = false;
      }
    }
    else if(e.type === 'back'){
      if(mode === 'revise'){
        // The pending revision hasn't dried yet — it erases normally.
        const g = pending.glyphs.pop();
        if(g){ const i = all.indexOf(g); if(i>=0) all.splice(i,1); }
      }else{
        if(!inBackRun){ runId++; inBackRun = true; }
        for(let i = main.length-1; i >= 0; i--){
          if(!main[i].struck){ main[i].struck = true; main[i].runId = runId; break; }
        }
      }
    }
    else if(e.type === 'revstart'){
      mode = 'revise';
      pending = { anchor: e.anchor, glyphs: [], live:true };
      inBackRun = false;
    }
    else if(e.type === 'revcancel'){
      if(pending){ for(const g of pending.glyphs){ const i=all.indexOf(g); if(i>=0) all.splice(i,1); } }
      mode = 'append'; pending = null;
    }
    else if(e.type === 'revcommit'){
      if(pending && pending.glyphs.length){
        runId++;
        strikeRange(main, pending.anchor, wordEnd(main, pending.anchor), runId);
        pending.live = false;
        revisions.set(pending.anchor, pending);
      }else if(pending){
        // nothing typed — treat as a cancel
      }
      mode = 'append'; pending = null;
    }
    else if(e.type === 'revstrike'){
      const r = revisions.get(e.anchor);
      if(r && !r.struck){ runId++; r.struck = true; r.runId = runId; for(const g of r.glyphs){ g.struck = true; g.runId = runId; } }
    }
  }
  // re-index after any splices so seq is contiguous
  all.forEach((g,i)=> g.seq = i);
  if(pending) revisions.set(pending.anchor, pending);

  /* --- pass 2: timing -> the discipline of the hand --------------------
     Speed says nothing about how much ink hits the page — a fast pen is
     not a darker pen. What speed changes is whether the pen LIFTS.

     Slow, deliberate writing prints: each letter is set down on its own,
     upright, with daylight around it. Fast writing is cursive — the nib
     never leaves the paper, so the exit stroke of one letter runs into the
     entry stroke of the next and the word becomes a single gesture.

     That forces a rule: WITHIN a word nothing may break the join. No
     per-letter rotation, no per-letter size, no per-letter baseline — the
     strokes can only meet if every letter of the word shares one baseline,
     one slant and one size. The unruliness of a hurrying hand therefore
     lives a level up, on the WORD: whole words lean, drift off the line and
     swell or shrink together. Letters flow; words stagger.
     ---------------------------------------------------------------------- */
  const N = all.length;

  for(let i=0;i<N;i++){
    const g = all[i];

    // (1) smoothed pace over a rolling window of 5 -> scrappiness 0..1
    let sum = 0, cnt = 0;
    for(let k = Math.max(0, i-4); k <= i; k++){ sum += Math.min(all[k].dt, DT_CAP); cnt++; }
    const avg = sum / cnt;
    // norm: 0 = flying, 1 = deliberate
    const norm = clamp(
      (Math.log(Math.max(avg, 8)) - Math.log(FAST_MS)) / (Math.log(SLOW_MS) - Math.log(FAST_MS)),
      0, 1);
    // A SPECTRUM, not a switch (Eric, 2026-08-24: "not a Boolean - four
    // levels, auto-detected"). A small deadzone below SCRAP_KNEE keeps truly
    // deliberate typing ruled-flat, then a gentle power curve ramps through
    // legible intermediate states: roughly 0-0.25 ruled, 0.25-0.5 relaxed
    // (a little lean, softer corners), 0.5-0.75 hurried (joins appear,
    // dots flick), 0.75-1 scrawl. Continuous underneath - the "levels" are
    // how it reads, not steps in the code.
    const speed = 1 - norm;
    const u = clamp((speed - SCRAP_KNEE) / (1 - SCRAP_KNEE), 0, 1);
    const scrap = clamp(Math.pow(u, 1.5) * S.scrapAmt, 0, 1);
    g.speed = speed;
    g.scrap = scrap;
    // the pen entrance: quick flicks when fast, unhurried strokes when slow
    g.revealMs = Math.round(lerp(215, 68, speed));

    // (2) Ink pressure. A careful hand presses EVENLY — so this unevenness is
    // gated by scrappiness too, exactly like the geometry. At the slow end
    // every letter is the same weight and the same colour; patchy, uneven ink
    // is a symptom of a hurrying pen, and it was the last thing making the
    // deliberate hand read as messy after the geometry went flat.
    g.density = clamp(0.90 + rnd(g.seq, 8) * 0.05 * scrap, 0, 1);
    g.opacity = clamp(0.86 + rnd(g.seq, 7) * 0.05 * scrap, 0, 1);
    g.blur    = 0;

    // (3) rhythm wobble: variance of recent intervals loosens the line.
    // A second source of looseness — but it is GATED by scrappiness, so the
    // deliberate end of the axis is genuinely ruled-line straight. Wobble can
    // only roughen a hand that is already hurrying; it can't unsettle a
    // careful one, however uneven the pauses between careful marks are.
    let vj = 0;
    if(S.wobbleOn){
      const w = [];
      for(let k = Math.max(0, i-7); k <= i; k++) w.push(Math.min(all[k].dt, DT_CAP));
      const m = w.reduce((a,b)=>a+b,0) / w.length;
      const v = Math.sqrt(w.reduce((a,b)=>a+(b-m)*(b-m),0) / w.length) / 320;
      // Gated by scrap, which is exactly 0 below the knee — so the careful
      // hand is ruled-flat, with no residual wobble at all.
      vj = clamp(v, 0, 1.4) * S.wobbleAmt * scrap;
    }
    g.vj = vj;
  }

  /* (5) the word pass: lean, drift and swell, uniform across the word — the
     unruliness of a hurrying hand lives on the WORD, never the letter, so
     the strokes of a joined word still meet (one baseline, one slant, one
     size). Tracking, though, is resolved PER GLYPH (not per word): it's the
     one thing the user wants breathing continuously with speed, letter to
     letter, inside the word. A word's lean/drift/swell character comes from
     the mean pace of its own letters, and its seeded variation from the seq
     of its first letter — so it is stable across re-layouts, font switches,
     resizes and replay. */
  function wordPass(list){
    let i = 0;
    while(i < list.length){
      const g = list[i];
      if(g.ch === ' ' || g.ch === '\n'){
        // A space isn't part of a word, but it still tracks continuously off
        // its own scrap. It keeps its full measure, and never a negative
        // one, so that however hard the hand hurries, words stay words.
        g.font = face.id; g.faceScale = face.scale; g.topK = M.top;
        g.cursive = false;
        let te = lerp(cap, face.join, g.scrap);
        te += rnd(g.seq, 2) * 0.045 * g.vj;
        g.trackEm = clamp(te, face.join, cap);
        g.size = baseSize;
        g.tracking = Math.max(0, g.trackEm * baseSize);
        g.skew = 0; g.rot = 0; g.jitter = 0;
        i++; continue;
      }
      let j = i, ss = 0, vv = 0;
      while(j < list.length && list[j].ch !== ' ' && list[j].ch !== '\n'){
        ss += list[j].scrap; vv += list[j].vj; j++;
      }
      const n  = j - i;
      const ms = ss / n, mv = vv / n;      // the word's own pace
      const s0 = list[i].seq;              // its seed
      // THE CONSTRUCTION DECISION: a flowing word doesn't print faster, it
      // switches to cursive forms. Per-word, because a hand commits to one
      // construction for the length of a word (and joined strokes need the
      // word-uniform baseline/slant/size anyway).
      const cursive = ms > CURSIVE_KNEE;
      // The messy state is now rare (see SCRAP_KNEE), so when it arrives it
      // should be unmistakable from across a room.
      const lean  = -19 * ms * (1 + rnd(s0, 11) * 0.30);
      const drift = rnd(s0, 12) * (5.4 * ms + 1.8 * mv);
      const swell = 1 + rnd(s0, 13) * 0.12 * ms;
      for(let k = i; k < j; k++){
        const gg = list[k];
        gg.cursive = cursive;
        // the font id doubles as the advance table selector (see charW)
        gg.font = cursive ? 'cursive' : face.id;
        gg.faceScale = face.scale; gg.topK = M.top;
        // per-letter tracking: the measure of how far the pen travelled
        // between two strokes, held in em so a word-level size change can't
        // reopen a join. At rest: SPREAD_CAP (scaled by the "Letter spread"
        // slider), continuously per glyph off that glyph's own scrap — never
        // past the cap. At speed it closes onto this face's own join
        // distance and stops dead there — never past it either.
        let te = lerp(cap, face.join, gg.scrap);
        te += rnd(gg.seq, 2) * 0.045 * gg.vj;
        gg.trackEm = clamp(te, face.join, cap);
        gg.skew = lean;      // one slant, or the strokes meet at an angle
        gg.jitter = drift;   // one baseline, or they meet at the wrong height
        gg.rot = 0;          // no letter turns against its neighbours
        gg.size = baseSize * swell;
        gg.tracking = gg.trackEm * gg.size;
      }
      i = j;
    }
  }
  wordPass(main);
  for(const r of revisions.values()) wordPass(r.glyphs);

  // Struck ink keeps its weight — crossing a word out doesn't lift ink off
  // the paper. The hairline through it is the only record of the deletion.
  for(const g of all){
    if(g.struck){
      g.opacity = clamp(g.opacity * S.ghostOp, 0.04, 1);
      g.blur = 0;
    }
    g.color = mixColor(g.density);
  }

  /* --- pass 3: position the main stream, wrapping at spaces --- */
  const advOf = g => charW(g.font, g.ch) * g.size + g.tracking;
  const ascPart = ascPx * 1.06;
  const lineY = k => PAD_TOP + lh * k + ascPart;

  let x = 0, line = 0;
  let i = 0;
  while(i < main.length){
    const g = main[i];
    if(g.ch === '\n'){
      // A newline is a zero-width event. Struck (backspaced over) it leaves
      // no ink to cross out and no break: the caret simply carries on with
      // the previous line, exactly as if the Enter had never been pressed.
      g.x = x; g.line = line; g.y = lineY(line); g.adv = 0;
      if(!g.struck){ x = 0; line++; }
      i++; continue;
    }
    if(g.ch === ' '){
      g.adv = advOf(g); g.x = x; g.line = line; g.y = lineY(line);
      x += g.adv; i++; continue;
    }
    // measure the whole word so we never break mid-word
    let j = i, w = 0;
    while(j < main.length && main[j].ch !== ' ' && main[j].ch !== '\n'){ w += advOf(main[j]); j++; }
    if(w > COL_W){
      // pathological long word: break per character
      for(let k=i;k<j;k++){
        const gg = main[k], a = advOf(gg);
        if(x + a > COL_W && x > 0){ x = 0; line++; }
        gg.adv = a; gg.x = x; gg.line = line; gg.y = lineY(line); x += a;
      }
      i = j; continue;
    }
    if(x + w > COL_W && x > 0){ x = 0; line++; }
    for(let k=i;k<j;k++){
      const gg = main[k], a = advOf(gg);
      gg.adv = a; gg.x = x; gg.line = line; gg.y = lineY(line); x += a;
    }
    i = j;
  }
  const caret = { x, y: lineY(line), h: (ascPx + descPx) * 0.86, line };

  /* --- pass 4: place revisions above their word --- */
  const revItems = [];
  for(const [anchor, r] of revisions){
    if(!r.glyphs.length) continue;
    const end = wordEnd(main, anchor);
    if(anchor >= main.length) continue;
    const a = main[anchor];
    // the word's on-page extent (use the first line if the word itself wrapped)
    let x0 = a.x, x1 = a.x, ln = a.line;
    for(let k = anchor; k < end; k++){
      if(main[k].line !== ln) break;
      x1 = main[k].x + main[k].adv;
    }
    const scale = 0.75;
    let w = 0;
    for(const g of r.glyphs){
      g.size *= scale; g.tracking *= scale; g.jitter *= scale;
      w += charW(g.font, g.ch) * g.size + g.tracking;
    }
    let rx = clamp((x0 + x1)/2 - w/2, 0, Math.max(0, COL_W - w));
    const ry = a.y - lh * 0.60;
    for(const g of r.glyphs){
      g.x = rx; g.y = ry; g.line = -1; g.adv = charW(g.font, g.ch)*g.size + g.tracking;
      rx += g.adv;
    }
    r.markX = (x0 + x1) / 2;
    r.markY = a.y - lh * 0.30;   // sits in the gap, pointing down at the word
    r.markSize = reprBase * 0.42;
    r.wordX0 = x0; r.wordX1 = x1; r.wordY = a.y; r.wordLine = ln;
    revItems.push(r);
  }

  /* --- pass 5: strike segments (one continuous hairline per run, per line) --- */
  const strikes = [];
  function collect(list){
    let k = 0;
    while(k < list.length){
      const g = list[k];
      // a struck newline is never the start of a hairline — it has no ink
      if(!g.struck || g.ch === '\n'){ k++; continue; }
      const rid = g.runId, ln = g.line;
      let x0 = g.x, x1 = g.x + g.adv, sz = g.size, y = g.y, k2 = k+1;
      while(k2 < list.length && list[k2].struck && list[k2].runId === rid && list[k2].line === ln){
        x1 = list[k2].x + list[k2].adv; sz = Math.max(sz, list[k2].size); k2++;
      }
      strikes.push({ x0, x1, y: y - sz * 0.30, seed: rid * 7 + ln, w: Math.max(1.4, sz*0.07) });
      k = k2;
    }
  }
  collect(main);
  for(const r of revItems) if(r.struck) collect(r.glyphs);

  /* --- stats for the caption --- */
  let unsaid = 0, prevStruck = false;
  for(const g of main){
    const s = g.struck && g.ch !== ' ' && g.ch !== '\n';
    if(s && !prevStruck) unsaid++;
    prevStruck = s;
  }
  for(const r of revItems) if(r.struck) unsaid++;

  const lastLine = Math.max(line, ...revItems.map(r=>r.wordLine), 0);
  const height = PAD_TOP + lh * (lastLine + 1) + PAD_BOT;

  return {
    font, lh, main, revisions:revItems, strikes, caret, all,
    // representative face/size for page furniture that isn't "the writing"
    // itself: placeholder, caption, revision caret mark.
    reprFont, reprBase, reprMetrics: reprM, line0Y: PAD_TOP + ascPart,
    height, lines: lastLine + 1,
    stats: {
      duration: events.length ? Math.round((Timeline.last() - Timeline.first())/1000) : 0,
      unsaid,
    },
  };
}

/* ============================== RENDERER ============================== */

const elPage   = document.getElementById('page');
const elGlyphs = document.getElementById('glyphs');
const elSvg    = document.getElementById('strikes');
const elCaret  = document.getElementById('caret');
const elPh     = document.getElementById('placeholder');
const elCap    = document.getElementById('caption');

// The pen-stroke reveal's mask must persist WHILE the animation runs (so the
// travelling gradient has something to reveal), but not a moment after: once
// the stroke lands, this is finished ink and should carry no mask at all —
// otherwise, since .reveal stays on the most-recently-rendered glyph until
// the next re-render, only the newest letter would ever have full-height ink.
// elGlyphs itself persists across re-renders (only its children are
// replaced), so one delegated listener here covers every glyph ever drawn.
elGlyphs.addEventListener('animationend', e => {
  if(e.animationName === 'penstroke') e.target.classList.remove('reveal');
});

let model = null;
let selection = null;   // {anchor} while a word is selected / being revised

// The entrance is a property of the RENDER, not of the glyph: only a mark
// that was just made gets drawn on. Re-layouts (font, resize, sliders) redraw
// the same ink without re-performing it.
let pendingEntrance = false;

// This styles the OUTER (.g) span: a real box (width = advance, top at
// TOP_K above the baseline, bottom DESC_K below) so transform-origin
// 50% 100% keeps meaning what the export mirrors. Color and opacity live
// here; the ink inside is SVG filled with currentColor. No font, no mask,
// no filter - the lifted-pen fade is stroke-taper geometry in handGlyph().
function glyphStyle(g){
  return 'left:'+g.x.toFixed(2)+'px;'+
    'top:'+(g.y - g.size*TOP_K).toFixed(2)+'px;'+
    'width:'+g.adv.toFixed(2)+'px;height:'+(g.size*(TOP_K+DESC_K)).toFixed(2)+'px;'+
    'color:'+g.color+';opacity:'+g.opacity.toFixed(3)+';'+
    'transform:translateY('+g.jitter.toFixed(2)+'px) skewX('+g.skew.toFixed(2)+'deg) '+
      'rotate('+g.rot.toFixed(2)+'deg);';
}
function wobblyPath(s){
  // a hairline that remembers it was drawn by a hand
  const len = Math.max(6, s.x1 - s.x0);
  const steps = Math.max(3, Math.round(len / 14));
  const amp = 0.9;
  let d = '';
  for(let i=0;i<=steps;i++){
    const t = i/steps;
    const x = s.x0 + len*t;
    const y = s.y + Math.sin(t*Math.PI*1.7 + s.seed) * amp * (0.35 + 0.65*Math.sin(t*Math.PI))
                  + rnd(s.seed*31 + i, 5) * 0.35;
    d += (i ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2);
  }
  return d;
}

function render(m){
  model = m;
  elPage.style.height = m.height + 'px';

  // the newest mark — the only one that gets performed rather than just drawn
  const fresh = (pendingEntrance && m.all.length) ? m.all[m.all.length-1] : null;
  pendingEntrance = false;

  // --- glyphs ---
  const frag = document.createDocumentFragment();
  const emit = (g, idx, revAnchor, list, li) => {
    const isRev = revAnchor !== undefined;
    if(g.ch === ' ' || g.ch === '\n') return;
    // The outer span (.g) is positioned and carries the lifted-pen fade
    // mask; the inner span (.gi) carries the character and the entrance
    // reveal mask/animation. Nested rather than layered on one element so
    // the two masks intersect instead of fighting (see the .gi CSS comment).
    const outer = document.createElement('span');
    // A committed revision is itself clickable — that's how you revise the
    // revision (which strikes it and drops you back in-line: the two-layer cap).
    const live = isRev && !g.struck && revAnchor >= 0;
    outer.className = 'g' + (g.struck ? '' : (isRev ? (live ? ' click' : '') : ' click'));
    if(isRev){ if(live) outer.dataset.rev = revAnchor; }
    else if(!g.struck && idx !== undefined) outer.dataset.i = idx;
    outer.style.cssText = glyphStyle(g);

    // is this glyph joined to its neighbours? (drives both the connector
    // and the blunt seams - a joined end must not taper to a point)
    const jIn  = list ? joinInfo(list[li - 1], g) : null;
    const jOut = list ? joinInfo(g, list[li + 1]) : null;

    // the ink: skeleton -> paths, drawn fresh for this glyph's own speed.
    // Deterministic off g.seq, so replay/resize/re-layout redraw identical ink.
    const paths = handGlyph(g.ch, {
      size: g.size, scrap: g.scrap, seed: g.seq, cursive: g.cursive,
      wobble: S.wobbleOn ? S.wobbleAmt : 0, weight: S.weight,
      joinIn: !!jIn, joinOut: !!jOut,
    });
    let inkHTML = '';
    for(const p of paths) inkHTML += '<path d="' + p.d + '" fill="currentColor"/>';

    // the connector from the previous letter: a real upstroke in solid ink,
    // dipping toward the baseline like a cursive underturn. Drawn in THIS
    // glyph's local space: word-uniform skew/jitter/size mean the previous
    // letter's ink sits at a plain x offset in this frame.
    if(jIn){
      inkHTML += '<path d="' + joinPath(jIn.ax, jIn.ay, jIn.bx, jIn.by, jIn.sag, g.seq) +
        '" fill="none" stroke="currentColor" stroke-opacity="' + joinAlpha(jIn.w).toFixed(2) +
        '" stroke-width="' + joinWidth(g.size, jIn.w).toFixed(2) + '" stroke-linecap="round"/>';
    }

    const inner = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    inner.setAttribute('class', 'gi' + (g === fresh ? ' reveal' : ''));
    inner.innerHTML = '<g transform="translate(0,' + (g.size*TOP_K).toFixed(2) + ')">' + inkHTML + '</g>';
    if(g === fresh) inner.style.setProperty('--rd', g.revealMs + 'ms');
    outer.appendChild(inner);

    frag.appendChild(outer);
  };

  m.main.forEach((g,i)=> emit(g, i, undefined, m.main, i));
  for(const r of m.revisions){
    r.glyphs.forEach((g,i) => emit(g, undefined, r.live ? -1 : r.anchor, r.glyphs, i));
    const mark = document.createElement('span');
    mark.className = 'g';
    mark.innerHTML = handTextSVG('^', r.markSize, 0.2, 9000 + r.anchor,
      mixColor(0.8)).svg;
    mark.style.cssText =
      'left:'+(r.markX - r.markSize*0.20)+'px;top:'+(r.markY - r.markSize*m.reprMetrics.top)+'px;'+
      'opacity:'+(0.72 * (r.struck ? S.ghostOp : 1)).toFixed(3)+';';
    frag.appendChild(mark);
  }

  // selection feedback: a quiet graphite underline
  if(selection){
    const a = m.main[selection.anchor];
    if(a){
      let x1 = a.x;
      for(let k = selection.anchor; k < m.main.length; k++){
        if(m.main[k].ch === ' ' || m.main[k].ch === '\n' || m.main[k].line !== a.line) break;
        x1 = m.main[k].x + m.main[k].adv;
      }
      const u = document.createElement('div');
      u.className = 'selunder';
      u.style.cssText = 'left:'+a.x+'px;top:'+(a.y + a.size*0.16)+'px;width:'+(x1-a.x)+'px;';
      frag.appendChild(u);
    }
  }

  elGlyphs.replaceChildren(frag);

  // --- strikes ---
  elSvg.setAttribute('width', COL_W);
  elSvg.setAttribute('height', m.height);
  let svg = '';
  for(const s of m.strikes){
    svg += '<path d="'+wobblyPath(s)+'" fill="none" stroke="'+mixColor(1)+
           '" stroke-opacity="'+STRIKE_OP+
           '" stroke-width="'+s.w.toFixed(2)+'" stroke-linecap="round"/>';
  }
  elSvg.innerHTML = svg;

  // --- caret ---
  let cx = m.caret.x, cy = m.caret.y, ch = m.caret.h;
  if(selection && selection.pending){
    const r = m.revisions.find(r => r.anchor === selection.anchor && r.live);
    if(r && r.glyphs.length){
      const last = r.glyphs[r.glyphs.length-1];
      cx = last.x + last.adv; cy = last.y; ch = last.size * 1.1;
    }else{
      const a = m.main[selection.anchor];
      if(a){ cx = (a.x + (a.x + a.adv))/2; cy = a.y - m.lh*0.60; ch = a.size*0.75; }
    }
  }
  elCaret.style.cssText = 'left:'+cx+'px;top:'+(cy-ch*0.82)+'px;height:'+ch+'px;';

  // --- placeholder ---
  if(m.main.length === 0 && !replaying){
    elPh.style.display = 'block';
    elPh.style.left = '0px';
    elPh.style.top  = (m.line0Y - m.reprBase*m.reprMetrics.top) + 'px';
    if(!elPh.dataset.drawn || +elPh.dataset.size !== m.reprBase){
      // The zero state teaches the whole piece in one line, by being it:
      // "type slowly" is set in the careful hand, "or fast" in the cursive
      // one. Nobody has to be told what the page does.
      elPh.innerHTML = handRunsSVG([
        { text: 'type slowly,', scrap: 0,    cursive: false },
        // "run", not "fast": the cursive s and c are still the weak letters
        // in the set, and this is the one line every visitor reads.
        // 0.72: unmistakably the cursive hand and fully joined, but below
        // the melt threshold (0.78) - this one line has to stay legible at
        // 28px, where a melted r or s goes soft.
        { text: ' or run',      scrap: 0.72, cursive: true  },
      ], m.reprBase, 7001).svg;
      elPh.dataset.drawn = '1'; elPh.dataset.size = m.reprBase;
    }
  }else{
    elPh.style.display = 'none';
  }

  // --- caption position ---
  elCap.style.top = (m.height - PAD_BOT + m.lh * 1.2) + 'px';
  elCap.innerHTML = captionHTML(m);

}

// The page signs itself with a date and nothing else. The stats line
// (duration / hesitations / words unsaid) was removed 2026-08-24 - it read
// as instrumentation on a surface that should read as paper.
const CAPTION_SIZE = 0.62;   // of base size; was 0.42 for the old stats line
function dateText(){
  const d = new Date();
  return d.toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});
}
function captionHTML(m){
  const cs = m.reprBase * CAPTION_SIZE;
  return '<span style="display:inline-block">' +
    handTextSVG(dateText(), cs, 0.25, 7200, 'currentColor').svg + '</span>';
}

/* ============================== INPUT ================================= */

let firstKeyDone = false;
let idleTimer = null;
let replaying = false;

function relayout(opts){
  render(layout(Timeline.events, opts));
}

function scheduleIdleCaption(){
  clearTimeout(idleTimer);
  elCap.classList.remove('show');
  idleTimer = setTimeout(()=>{
    if(!replaying && Timeline.events.length){ relayout(); elCap.classList.add('show'); }
  }, IDLE_CAP);
}
function touched(){ scheduleIdleCaption(); }

function commitRevision(){
  if(!selection || !selection.pending) return;
  Timeline.push({ type:'revcommit', t: Date.now() });
  selection = null;
  relayout(); touched();
}
function cancelRevision(){
  if(!selection) return;
  if(selection.pending) Timeline.push({ type:'revcancel', t: Date.now() });
  selection = null;
  relayout();
}

function typeChar(ch){
  const t = Date.now();
  if(!firstKeyDone){ firstKeyDone = true; elPh.style.opacity = '0'; }
  if(selection){
    if(ch === ' ' || ch === '\n'){
      if(selection.pending){ commitRevision(); return; }
      cancelRevision();
      // fall through and write the space in-line
    }else{
      if(!selection.pending){
        Timeline.push({ type:'revstart', anchor: selection.anchor, t });
        selection.pending = true;
      }
      Timeline.push({ type:'char', ch, t });
      pendingEntrance = true;
      relayout(); touched(); return;
    }
  }
  Timeline.push({ type:'char', ch, t });
  pendingEntrance = true;
  relayout(); touched();
}

function backspace(){
  Timeline.push({ type:'back', t: Date.now() });
  if(selection && selection.pending){
    // nothing more to erase in the pending revision? leave revision mode open
  }
  relayout(); touched();
}

window.addEventListener('keydown', e => {
  if((e.metaKey || e.ctrlKey) && (e.key === '/' || e.code === 'Slash')){
    e.preventDefault(); togglePanel(); return;
  }
  if(e.target && e.target.closest && e.target.closest('#panel')) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(replaying) return;

  if(e.key === 'Escape'){ e.preventDefault(); cancelRevision(); return; }
  if(e.key === 'Backspace'){ e.preventDefault(); backspace(); return; }
  if(e.key === 'Enter'){ e.preventDefault(); typeChar('\n'); return; }
  if(e.key.length === 1){ e.preventDefault(); typeChar(e.key); return; }
});

// click a written word to revise it above the line
elPage.addEventListener('mousedown', e => {
  if(replaying) return;
  if(e.target.closest('#panel')) return;
  const span = e.target.closest('.g.click');
  if(!span){
    if(selection){ if(selection.pending) commitRevision(); else cancelRevision(); }
    return;
  }
  // two-layer cap: clicking a committed revision strikes it, and writing
  // simply resumes in-line rather than stacking a third layer above the page.
  if(span.dataset.rev !== undefined){
    e.preventDefault();
    if(selection){ if(selection.pending) commitRevision(); else cancelRevision(); }
    Timeline.push({ type:'revstrike', anchor:+span.dataset.rev, t:Date.now() });
    selection = null; relayout(); touched();
    return;
  }
  if(span.dataset.i === undefined){
    if(selection){ if(selection.pending) commitRevision(); else cancelRevision(); }
    return;
  }
  e.preventDefault();
  const idx = +span.dataset.i;
  // walk left to the start of the word
  let a = idx;
  while(a > 0){
    const p = model.main[a-1];
    if(p.ch === ' ' || p.ch === '\n' || p.struck) break;
    a--;
  }
  if(selection){ if(selection.pending) commitRevision(); else cancelRevision(); }

  // two-layer cap: a word revised once can't be revised again — strike the
  // floating word instead, and let writing continue in-line.
  const existing = model.revisions.find(r => r.anchor === a && !r.live);
  if(existing){
    if(!existing.struck) Timeline.push({ type:'revstrike', anchor:a, t:Date.now() });
    selection = null; relayout(); touched(); return;
  }
  selection = { anchor:a, pending:false };
  relayout();
});

window.addEventListener('resize', () => { if(model) relayout(); });

/* ============================== REPLAY ================================ */

let replayTimers = [];
function stopReplay(){
  replayTimers.forEach(clearTimeout);
  replayTimers = [];
  replaying = false;
  document.getElementById('btnReplay').textContent = 'Replay';
}
function replay(){
  if(replaying){ stopReplay(); relayout(); return; }
  const evs = Timeline.events;
  if(!evs.length) return;
  replaying = true;
  selection = null;
  document.getElementById('btnReplay').textContent = 'Stop';
  elCap.classList.remove('show');

  // honour the original rhythm, but never make the viewer wait more than 3s
  let acc = 0, prev = evs[0].t;
  const schedule = [];
  for(let i=0;i<evs.length;i++){
    acc += Math.min(evs[i].t - prev, REPLAY_GAP_CAP);
    prev = evs[i].t;
    schedule.push(acc);
  }
  // Replay renders through CURRENT settings — that's the whole point of it.
  render(layout([], {nowT:0}));
  for(let i=0;i<evs.length;i++){
    replayTimers.push(setTimeout(()=>{
      // a replay re-performs the writing: each letter is drawn as it lands
      pendingEntrance = (evs[i].type === 'char');
      render(layout(evs.slice(0, i+1), { nowT: evs[i].t }));
      if(i === evs.length-1){ stopReplay(); relayout(); touched(); }
    }, schedule[i] + 220));
  }
}

/* ============================== EXPORT ================================ */

function makeGrainTile(){
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const img = g.createImageData(128,128);
  for(let i=0;i<img.data.length;i+=4){
    const v = 128 + (Math.random()-0.5)*255;
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = 14;
  }
  g.putImageData(img,0,0);
  return c;
}

async function savePage(){
  await document.fonts.ready;
  const m = layout(Timeline.events, {});
  const DPR = 2;
  const PADX = 68;
  const W = COL_W + PADX*2;
  const H = Math.max(m.height, 520);
  const c = document.createElement('canvas');
  c.width = W*DPR; c.height = H*DPR;
  const x = c.getContext('2d');
  x.scale(DPR, DPR);

  // paper
  x.fillStyle = '#f5f1e8'; x.fillRect(0,0,W,H);
  const warm = x.createRadialGradient(W/2, 0, 0, W/2, 0, H*1.1);
  warm.addColorStop(0,'rgba(255,253,247,0.55)');
  warm.addColorStop(1,'rgba(224,216,200,0.45)');
  x.fillStyle = warm; x.fillRect(0,0,W,H);
  const pat = x.createPattern(makeGrainTile(), 'repeat');
  x.globalAlpha = 0.5; x.fillStyle = pat; x.fillRect(0,0,W,H); x.globalAlpha = 1;

  x.save();
  x.translate(PADX, 0);
  x.textBaseline = 'alphabetic';

  const drawGlyph = (g, li, arr) => {
    if(g.ch === ' ' || g.ch === '\n') return;
    // The DOM shears each glyph about its box's bottom-centre
    // (transform-origin:50% 100%): box bottom sits size*DESC_K below the
    // baseline. Word-uniform lean means that offset is constant across a
    // word. Mirror the origin exactly, then fill the same handGlyph paths
    // the DOM drew - the ink is identical geometry, not a re-rendering.
    const dy = g.size * DESC_K;
    x.save();
    x.translate(g.x + g.adv/2, g.y + g.jitter + dy);
    if(g.skew) x.transform(1, 0, Math.tan(g.skew * Math.PI/180), 1, 0, 0);
    if(g.rot) x.rotate(g.rot * Math.PI/180);
    x.translate(-g.adv/2, -dy);
    x.globalAlpha = g.opacity;
    x.fillStyle = g.color;
    const jIn  = arr ? joinInfo(arr[li - 1], g) : null;
    const jOut = arr ? joinInfo(g, arr[li + 1]) : null;
    const paths = handGlyph(g.ch, {
      size: g.size, scrap: g.scrap, seed: g.seq, cursive: g.cursive,
      wobble: S.wobbleOn ? S.wobbleAmt : 0, weight: S.weight,
      joinIn: !!jIn, joinOut: !!jOut,
    });
    for(const p of paths) x.fill(new Path2D(p.d));
    x.restore();
  };
  // connectors mirror render(): same joinInfo gate, same ink
  const drawJoins = list => {
    for(let li = 1; li < list.length; li++){
      const g = list[li];
      const jIn = joinInfo(list[li - 1], g);
      if(!jIn) continue;
      const dy = g.size * DESC_K;
      x.save();
      x.translate(g.x + g.adv/2, g.y + g.jitter + dy);
      if(g.skew) x.transform(1, 0, Math.tan(g.skew * Math.PI/180), 1, 0, 0);
      x.translate(-g.adv/2, -dy);
      x.globalAlpha = joinAlpha(jIn.w) * g.opacity;
      x.strokeStyle = g.color;
      x.lineWidth = joinWidth(g.size, jIn.w);
      x.lineCap = 'round';
      x.stroke(new Path2D(joinPath(jIn.ax, jIn.ay, jIn.bx, jIn.by, jIn.sag, g.seq)));
      x.restore();
    }
  };

  m.main.forEach(drawGlyph);
  drawJoins(m.main);
  for(const r of m.revisions){
    r.glyphs.forEach(drawGlyph);
    drawJoins(r.glyphs);
    x.save();
    x.globalAlpha = 0.72 * (r.struck ? S.ghostOp : 1);
    x.fillStyle = mixColor(0.8);
    x.translate(r.markX - r.markSize*0.20, r.markY);
    for(const pp of handTextParts('^', r.markSize, 0.2, 9000 + r.anchor).parts)
      x.fill(new Path2D(pp.d));
    x.restore();
  }
  // strikes
  x.strokeStyle = mixColor(1);
  x.globalAlpha = STRIKE_OP;
  x.lineCap = 'round';
  for(const s of m.strikes){
    x.lineWidth = s.w;
    const len = Math.max(6, s.x1 - s.x0);
    const steps = Math.max(3, Math.round(len/14));
    x.beginPath();
    for(let i=0;i<=steps;i++){
      const t = i/steps;
      const px = s.x0 + len*t;
      const py = s.y + Math.sin(t*Math.PI*1.7 + s.seed)*0.9*(0.35+0.65*Math.sin(t*Math.PI)) + rnd(s.seed*31+i,5)*0.35;
      i ? x.lineTo(px,py) : x.moveTo(px,py);
    }
    x.stroke();
  }
  x.globalAlpha = 1;
  x.restore();

  // caption - the date alone, same engine text and size as the page
  const cs = m.reprBase * CAPTION_SIZE;
  const cap = handTextParts(dateText(), cs, 0.25, 7200);
  x.fillStyle = mixColor(0.15);
  x.globalAlpha = 0.5;
  x.save(); x.translate(W/2 - cap.w/2, H - 74);
  for(const pp of cap.parts){ x.save(); x.translate(pp.tx, 0); x.fill(new Path2D(pp.d)); x.restore(); }
  x.restore();
  x.globalAlpha = 1;

  c.toBlob(b => {
    const url = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pen-and-paper-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.png';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, 'image/png');
}

/* ============================ CONTROL PANEL =========================== */

const elPanel = document.getElementById('panel');
// The page opens as a writing surface and nothing else (Eric, 2026-08-24).
// The panel still exists behind Cmd/Ctrl + / for tuning; it is simply never
// put in front of anyone who didn't ask for it.
function togglePanel(){ elPanel.classList.toggle('on'); }

(function buildPanel(){
  const host = document.getElementById('controls');
  for(const s of SPEC){
    if(s.type === 'range'){
      const row = document.createElement('div'); row.className = 'row';
      const out = document.createElement('span'); out.className = 'val';
      out.textContent = s.fmt(S[s.key]);
      const lab = document.createElement('label');
      lab.innerHTML = '<span>'+s.label+'</span>';
      lab.appendChild(out);
      const inp = document.createElement('input');
      inp.type='range'; inp.min=s.min; inp.max=s.max; inp.step=s.step; inp.value=S[s.key];
      inp.oninput = () => {
        S[s.key] = parseFloat(inp.value);
        out.textContent = s.fmt(S[s.key]);
        saveSettings();
        if(!replaying) relayout();
      };
      row.appendChild(lab); row.appendChild(inp); host.appendChild(row);
    }
    else if(s.type === 'toggle'){
      const l = document.createElement('label'); l.className = 'tog';
      const inp = document.createElement('input'); inp.type='checkbox'; inp.checked = !!S[s.key];
      inp.onchange = () => { S[s.key] = inp.checked; saveSettings(); if(!replaying) relayout(); };
      l.appendChild(inp);
      l.appendChild(document.createTextNode(s.label));
      host.appendChild(l);
    }
  }
})();

document.getElementById('btnReplay').onclick = replay;
document.getElementById('btnSave').onclick   = savePage;
document.getElementById('btnClear').onclick  = () => {
  stopReplay();
  Timeline.clear();
  selection = null; firstKeyDone = false;
  elPh.style.opacity = '';
  elCap.classList.remove('show');
  relayout();
};
elPanel.addEventListener('mousedown', e => e.stopPropagation());

/* ============================== BOOT ================================== */

(function boot(){
  // no webfonts to wait for anymore - the letterforms are ours
  relayout();
  scheduleIdleCaption();
})();
</script>
