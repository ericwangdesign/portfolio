<style>
  :root{
    --bg:#0b0b0c; --panel:#111113; --line:#232326; --txt:#e8e8ea;
    --dim:#8a8a92; --accent:#e8e8ea; --radius:6px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--txt);
    font:12px/1.4 ui-sans-serif,-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  #app{display:flex; height:100vh}
  main{flex:1; display:grid; place-items:center; position:relative; min-width:0}
  #stageWrap{width:min(92vh,92%); aspect-ratio:1/1; position:relative}
  svg#stage{width:100%; height:100%; display:block; border-radius:2px}

  #hud{position:absolute; left:18px; bottom:14px; display:flex; gap:14px;
       color:var(--dim); font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
       letter-spacing:.06em; text-transform:uppercase; pointer-events:none}

  aside{
    width:308px; flex:none; background:var(--panel); border-left:1px solid var(--line);
    overflow-y:auto; overscroll-behavior:contain;
  }
  aside::-webkit-scrollbar{width:8px}
  aside::-webkit-scrollbar-thumb{background:#2a2a2e;border-radius:8px}

  .head{padding:16px 16px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:5}
  .head h1{margin:0; font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600}
  .head p{margin:5px 0 0; color:var(--dim); font-size:11px}

  .sect{border-bottom:1px solid var(--line); padding:12px 16px 14px}
  .sect > h2{
    margin:0 0 10px; font:10px/1 ui-monospace,Menlo,monospace; letter-spacing:.16em;
    text-transform:uppercase; color:var(--dim); font-weight:500;
  }

  .row{display:grid; grid-template-columns:1fr auto; align-items:center; gap:6px; margin-bottom:9px}
  .row label{color:var(--txt); font-size:11.5px; cursor:default; user-select:none}
  .row .val{font:10.5px/1 ui-monospace,Menlo,monospace; color:var(--dim); min-width:44px; text-align:right; cursor:ew-resize}
  .row input[type=range]{grid-column:1/-1; -webkit-appearance:none; appearance:none; width:100%; height:14px; background:transparent; margin:-2px 0 0}
  input[type=range]::-webkit-slider-runnable-track{height:2px; background:#2c2c31; border-radius:2px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:11px; height:11px; margin-top:-4.5px; border-radius:50%;
    background:var(--accent); border:none; cursor:pointer; transition:transform .1s;
  }
  input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.18)}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.3)}

  .btns{display:flex; flex-wrap:wrap; gap:6px}
  button{
    font:11px/1 inherit; color:var(--txt); background:#1a1a1e; border:1px solid #2a2a2f;
    padding:7px 10px; border-radius:var(--radius); cursor:pointer; transition:.12s;
  }
  button:hover{background:#232329; border-color:#3a3a42}
  button:active{transform:translateY(1px)}
  button.on{background:var(--txt); color:#0b0b0c; border-color:var(--txt)}
  button.wide{flex:1}

  .swatches{display:flex; gap:8px; align-items:center}
  .sw{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim)}
  input[type=color]{width:26px;height:22px;padding:0;border:1px solid #2a2a2f;border-radius:4px;background:#1a1a1e;cursor:pointer}

  .hint{color:#63636b; font-size:10.5px; line-height:1.5; margin:8px 0 0}
  kbd{font:10px ui-monospace,Menlo,monospace; background:#1d1d21; border:1px solid #2c2c32;
      border-radius:3px; padding:1px 4px; color:var(--dim)}

  /* narrow screens: stack the panel under the canvas */
  @media (max-width:760px){
    body{overflow:auto}
    #app{flex-direction:column; height:auto; min-height:100vh}
    main{flex:none; padding:16px 0 4px}
    #stageWrap{width:min(94vw,560px)}
    aside{width:100%; border-left:none; border-top:1px solid var(--line); overflow-y:visible}
    .head{position:static}
    #hud{position:static; margin:10px 0 0; justify-content:center}
    .sect{padding:14px 18px 16px}
    .row{margin-bottom:14px}
    .row input[type=range]{height:26px}
    input[type=range]::-webkit-slider-thumb{width:17px;height:17px;margin-top:-7.5px}
    button{padding:10px 12px}
  }

<body>
<div id="app">
  <main>
    <div id="stageWrap">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="-500 -500 1000 1000"></svg>
    </div>
    <div id="hud">
      <span id="hudPaths">—</span>
      <span id="hudTime">t 0.00s</span>
      <span id="hudState">playing</span>
    </div>
  </main>

  <aside>
    <div class="head">
      <h1>Star Ribbon</h1>
      <p>Parametric logo canvas · live SVG</p>
    </div>
    <div id="panel"></div>
  </aside>
</div>

<script>
/* ------------------------------------------------------------------
   MODEL
   Four lobes with 4-fold rotational symmetry. Each lobe is a family of
   nested cubic-Bezier arcs that share the two star tips and bow inward.
     depth   = how far an arc bows toward the centre (outer→inner sweep)
     sweep   = asymmetry between the two control handles (the "lean")
     twist   = each successive arc's tips rotate, producing the crossover
   Brightness is three multiplied terms: across the band (glare), along
   each path (falloff toward the tips), and a per-lobe light response —
   opposite lobes match, adjacent ones differ, so the mark never reads
   as flatly symmetrical. See lobeLit().
-------------------------------------------------------------------*/

const CTRL = [
  {g:'Form', items:[
    {k:'radius',   n:'Radius',        min:120, max:490, step:1,    v:470, f:0},
    {k:'rotation', n:'Rotation',      min:-180,max:180, step:.5,   v:0,   f:1, u:'°'},
    {k:'tipSharp', n:'Tip sharpness', min:.02, max:.50, step:.005, v:.30, f:3},
    {k:'cornerR',  n:'Corner radius', min:0,   max:.45, step:.005, v:.095,f:3},
    {k:'cornerT',  n:'Corner tension',min:.1,  max:1,   step:.01,  v:.55, f:2},
    {k:'sweep',    n:'Sweep',         min:-1,  max:1,   step:.01,  v:.45, f:2},
    {k:'twist',    n:'Twist',         min:-90, max:90,  step:.5,   v:9,   f:1, u:'°'},
    {k:'taper',    n:'Taper',         min:0,   max:.6,  step:.005, v:0,   f:3},
  ]},
  {g:'Band', items:[
    {k:'count',      n:'Lines / lobe', min:2, max:80,  step:1,    v:24,  f:0},
    {k:'depthOuter', n:'Depth · outer',min:0, max:.75, step:.005, v:.215,f:3},
    {k:'depthInner', n:'Depth · inner',min:0, max:.95, step:.005, v:.44, f:3},
    {k:'gamma',      n:'Distribution', min:.3,max:3,   step:.02,  v:1.45,f:2},
  ]},
  {g:'Light', items:[
    {k:'weight',    n:'Stroke weight', min:.2, max:6,  step:.05, v:1.3, f:2},
    {k:'opMin',     n:'Floor',         min:0,  max:1,  step:.01, v:.22, f:2},
    {k:'opMax',     n:'Peak',          min:0,  max:1,  step:.01, v:1,   f:2},
    {k:'glarePos',  n:'Glare position',min:0,  max:1,  step:.005,v:.24, f:3},
    {k:'glareWide', n:'Glare width',   min:.03,max:1.2,step:.005,v:.38, f:3},
    {k:'tipFade',   n:'Tip falloff',   min:0,  max:1,  step:.01, v:.66, f:2},
    {k:'tipFadePos',n:'Falloff centre',min:0,  max:1,  step:.005,v:.5,  f:3},
    {k:'bloom',     n:'Bloom',         min:0,  max:2,  step:.01, v:.40, f:2},
  ]},
  {g:'Facets', items:[
    {k:'lightAngle',n:'Light angle',   min:0,  max:180,step:.5,  v:45,  f:1, u:'°'},
    {k:'altDepth',  n:'Contrast',      min:0,  max:1,  step:.01, v:.55, f:2},
    {k:'altGlare',  n:'Glare offset',  min:-.5,max:.5, step:.005,v:.16, f:3},
  ]},
  {g:'Motion', items:[
    {k:'spin',        n:'Spin',          min:-60,max:60, step:.5,  v:5,  f:1, u:'°/s'},
    {k:'twistAmp',    n:'Twist wobble',  min:0,  max:60, step:.5,  v:0,  f:1, u:'°'},
    {k:'twistRate',   n:'· rate',        min:.01,max:1.5,step:.01, v:.14,f:2, u:'hz'},
    {k:'breatheAmp',  n:'Breathe',       min:0,  max:.4, step:.005,v:0,  f:3},
    {k:'breatheRate', n:'· rate',        min:.01,max:1.5,step:.01, v:.1, f:2, u:'hz'},
    {k:'glareDrift',  n:'Glare drift',   min:-1, max:1,  step:.01, v:0,  f:2, u:'/s'},
    {k:'lightDrift',  n:'Light drift',   min:-40,max:40, step:.5,  v:0,  f:1, u:'°/s'},
  ]},
];

const P = {};
CTRL.forEach(s => s.items.forEach(i => P[i.k] = i.v));

const PRESETS = {
  Reference:{radius:470,rotation:0,tipSharp:.30,cornerR:.095,cornerT:.55,sweep:.45,
             twist:9,taper:0,count:24,depthOuter:.215,depthInner:.44,gamma:1.45,
             weight:1.3,opMin:.22,opMax:1,glarePos:.24,glareWide:.38,
             tipFade:.66,tipFadePos:.5,bloom:.40,
             lightAngle:45,altDepth:.55,altGlare:.16},
  Flat:     {altDepth:0,altGlare:0},
  Point:    {radius:430,cornerR:0,tipSharp:.28,sweep:.45,twist:9,count:24,
             depthOuter:.215,depthInner:.44,gamma:1.45,weight:1.3,bloom:.40},
  Pillow:   {radius:470,cornerR:.30,cornerT:.62,tipSharp:.34,sweep:.38,twist:7,
             count:24,depthOuter:.20,depthInner:.42,gamma:1.45,weight:1.3,bloom:.5},
  Wire:     {count:44,weight:.55,depthOuter:.17,depthInner:.60,twist:0,sweep:0,
             cornerR:.12,cornerT:.45,gamma:1,bloom:.15,opMin:.4,glareWide:.5},
  Ribbon:   {count:26,twist:44,sweep:.72,depthOuter:.24,depthInner:.58,tipSharp:.22,
             cornerR:.20,cornerT:.5,weight:1.3,bloom:.6,glarePos:.3},
  Blade:    {count:16,tipSharp:.07,cornerR:.07,cornerT:.35,depthOuter:.30,
             depthInner:.74,twist:8,sweep:.5,weight:2.2,bloom:.9,glarePos:.12,glareWide:.25},
  Halo:     {count:60,weight:.8,depthOuter:.08,depthInner:.30,twist:-26,sweep:-.4,
             cornerR:.28,cornerT:.6,gamma:1.9,bloom:1.2,opMin:.15,glarePos:.55,glareWide:.45},
};

let bgColor = '#000000', inkColor = '#ffffff';
let playing = true, t = 0, speed = 1, lastMs = null;

/* ------------------------------ geometry ------------------------------ */
const lerp = (a,b,x) => a + (b-a)*x;

/* vector + cubic-Bezier helpers (de Casteljau) */
const vAdd = (a,b) => [a[0]+b[0], a[1]+b[1]];
const vSub = (a,b) => [a[0]-b[0], a[1]-b[1]];
const vMul = (a,s) => [a[0]*s, a[1]*s];
const vLen = a => Math.hypot(a[0], a[1]);
const vUnit = a => { const l = vLen(a) || 1; return [a[0]/l, a[1]/l]; };
const vLerp = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];

function bezLeft(p, t){                       // control points of [0, t]
  const a=vLerp(p[0],p[1],t), b=vLerp(p[1],p[2],t), c=vLerp(p[2],p[3],t);
  const d=vLerp(a,b,t), e=vLerp(b,c,t);
  return [p[0], a, d, vLerp(d,e,t)];
}
function bezRight(p, t){                      // control points of [t, 1]
  const a=vLerp(p[0],p[1],t), b=vLerp(p[1],p[2],t), c=vLerp(p[2],p[3],t);
  const d=vLerp(a,b,t), e=vLerp(b,c,t);
  return [vLerp(d,e,t), e, c, p[3]];
}
const bezSub = (p,t0,t1) => bezLeft(bezRight(p,t0), (t1-t0)/(1-t0));

function lobeCubic(lobe, u, e){
  const twist = e.twist * u * Math.PI/180;
  const base  = e.rotation*Math.PI/180 + twist + lobe*Math.PI/2;
  const R = e.radius * (1 - e.taper*u);
  const a = base, b = base + Math.PI/2;
  const A = [R*Math.cos(a), R*Math.sin(a)];
  const B = [R*Math.cos(b), R*Math.sin(b)];

  const dx = B[0]-A[0], dy = B[1]-A[1];
  const len = Math.hypot(dx,dy) || 1;
  const tx = dx/len, ty = dy/len;

  // inward normal: from chord midpoint toward the origin
  const mx = (A[0]+B[0])/2, my = (A[1]+B[1])/2;
  const mLen = Math.hypot(mx,my) || 1;
  const nx = -mx/mLen, ny = -my/mLen;

  const h  = lerp(e.depthOuter, e.depthInner, u) * len;
  const s1 = h * (1 + e.sweep), s2 = h * (1 - e.sweep);
  const f1 = e.tipSharp, f2 = 1 - e.tipSharp;

  const c1 = [A[0] + tx*f1*len + nx*s1, A[1] + ty*f1*len + ny*s1];
  const c2 = [A[0] + tx*f2*len + nx*s2, A[1] + ty*f2*len + ny*s2];
  return [A, c1, c2, B];
}

/* One nested loop at band-position u, returned as four lobe pieces.
   Each piece runs corner-midpoint → arc → corner-midpoint, so the four
   pieces still tile a closed star but every tip is a smooth G1 fold. */
function buildLoop(u, e){
  const arcs = [0,1,2,3].map(i => lobeCubic(i, u, e));
  const tc = Math.min(.45, e.cornerR);
  if (tc < .002) return arcs.map(a => ({seg:[a], A:a[0], B:a[3]}));

  const trim = arcs.map(a => bezSub(a, tc, 1-tc));
  const fill = [];
  for (let i=0;i<4;i++){
    const prev = trim[(i+3)%4], cur = trim[i];
    const E = prev[3], Te = vUnit(vSub(prev[3], prev[2]));
    const S = cur[0],  Ts = vUnit(vSub(cur[1], cur[0]));
    const k = e.cornerT * vLen(vSub(S, E));
    fill[i] = [E, vAdd(E, vMul(Te,k)), vSub(S, vMul(Ts,k)), S];
  }
  return [0,1,2,3].map(i => {
    const inHalf  = bezRight(fill[i], .5);        // back half of this tip's fold
    const outHalf = bezLeft(fill[(i+1)%4], .5);   // front half of the next tip's fold
    return {seg:[inHalf, trim[i], outHalf], A:inHalf[0], B:outHalf[3]};
  });
}

function pathD(segs){
  const r = n => Math.round(n*100)/100;
  let d = `M${r(segs[0][0][0])} ${r(segs[0][0][1])}`;
  for (const s of segs)
    d += `C${r(s[1][0])} ${r(s[1][1])} ${r(s[2][0])} ${r(s[2][1])} ${r(s[3][0])} ${r(s[3][1])}`;
  return d;
}

const wrap01 = x => ((x % 1) + 1) % 1;

/* Per-lobe light response. cos(2·Δ) is deliberate: it makes OPPOSITE lobes
   match and ADJACENT lobes differ — the 2-fold lighting over 4-fold geometry
   that a twisted band shows under a fixed light. The angle is measured in
   world space, so when the mark spins the light stays put and each arm
   swings through the highlight. */
function lobeLit(i, e){
  const th = (e.rotation + i*90 + 45) * Math.PI/180;
  const L  = e.lightAngle * Math.PI/180;
  const s  = (1 - Math.cos(2*(th - L))) / 2;   // 0 = facing the light, 1 = turned away
  return {mul: 1 - e.altDepth*s, shift: e.altGlare*s};
}

function brightness(u, e, lit){
  const d = (u - (e.glarePos + lit.shift)) / Math.max(e.glareWide, .001);
  return (e.opMin + (e.opMax - e.opMin) * Math.exp(-d*d)) * lit.mul;
}

/* ------------------------------ rendering ------------------------------ */
const stage = document.getElementById('stage');
let built = -1, groups = [];

function build(n){
  stage.innerHTML = '';
  groups = [];
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs={}) => { const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };

  const defs = mk('defs');
  const filt = mk('filter', {id:'bloom', x:'-40%', y:'-40%', width:'180%', height:'180%'});
  const blur = mk('feGaussianBlur', {stdDeviation:'8', id:'bloomBlur'});
  filt.appendChild(blur); defs.appendChild(filt);

  for (let i=0;i<4;i++){
    const grad = mk('linearGradient', {id:'lg'+i, gradientUnits:'userSpaceOnUse'});
    const st = [mk('stop',{offset:'0'}), mk('stop',{offset:'.5'}), mk('stop',{offset:'1'})];
    st.forEach(s=>grad.appendChild(s));
    defs.appendChild(grad);
  }
  stage.appendChild(defs);

  const bg = mk('rect', {id:'bg', x:-500, y:-500, width:1000, height:1000, fill:bgColor});
  stage.appendChild(bg);

  const lines = mk('g', {id:'lines', fill:'none', 'stroke-linecap':'round'});
  for (let i=0;i<4;i++){
    const g = mk('g', {id:'lobe'+i, stroke:`url(#lg${i})`});
    const paths = [];
    for (let k=0;k<n;k++){ const p = mk('path'); g.appendChild(p); paths.push(p); }
    lines.appendChild(g); groups.push({g, paths});
  }
  const glow = mk('use', {href:'#lines', 'xlink:href':'#lines', filter:'url(#bloom)', id:'glow'});
  stage.appendChild(glow);
  stage.appendChild(lines);
  built = n;
}

function effective(){
  const e = Object.assign({}, P);
  e.rotation   += P.spin * t;
  e.twist      += P.twistAmp * Math.sin(2*Math.PI*P.twistRate*t);
  e.depthInner  = Math.max(0, e.depthInner + P.breatheAmp * Math.sin(2*Math.PI*P.breatheRate*t));
  e.glarePos    = wrap01(e.glarePos + P.glareDrift * t);
  e.lightAngle += P.lightDrift * t;
  return e;
}

function render(){
  const e = effective();
  const n = Math.round(e.count);
  if (n !== built) build(n);

  document.getElementById('bg').setAttribute('fill', bgColor);
  document.getElementById('bloomBlur').setAttribute('stdDeviation', (e.bloom*9).toFixed(2));
  document.getElementById('glow').setAttribute('opacity', Math.min(1, e.bloom).toFixed(3));
  document.getElementById('glow').setAttribute('display', e.bloom > .001 ? 'inline' : 'none');

  const midK = Math.floor(n/2), ends = [];
  const lits = [0,1,2,3].map(i => lobeLit(i, e));
  for (let k=0;k<n;k++){
    const u = n === 1 ? 0 : Math.pow(k/(n-1), e.gamma);
    const lobes = buildLoop(u, e);
    const w = e.weight.toFixed(2);
    for (let i=0;i<4;i++){
      const p = groups[i].paths[k];
      p.setAttribute('d', pathD(lobes[i].seg));
      p.setAttribute('stroke-width', w);
      p.setAttribute('stroke-opacity', brightness(u, e, lits[i]).toFixed(3));
      if (k === midK) ends[i] = lobes[i];
    }
  }

  for (let i=0;i<4;i++){
    const grad = document.getElementById('lg'+i);
    const {A,B} = ends[i] || buildLoop(.5, e)[i];
    grad.setAttribute('x1',A[0].toFixed(1)); grad.setAttribute('y1',A[1].toFixed(1));
    grad.setAttribute('x2',B[0].toFixed(1)); grad.setAttribute('y2',B[1].toFixed(1));
    const edge = (1 - e.tipFade).toFixed(3);
    const stops = grad.children;
    stops[0].setAttribute('offset','0');
    stops[1].setAttribute('offset', e.tipFadePos.toFixed(3));
    stops[2].setAttribute('offset','1');
    for (const s of stops) s.setAttribute('stop-color', inkColor);
    stops[0].setAttribute('stop-opacity', edge);
    stops[1].setAttribute('stop-opacity','1');
    stops[2].setAttribute('stop-opacity', edge);
  }

  document.getElementById('hudPaths').textContent = (n*4) + ' paths';
  document.getElementById('hudTime').textContent  = 't ' + t.toFixed(2) + 's';
}

function tick(ms){
  if (lastMs === null) lastMs = ms;
  const dt = Math.min(.05, (ms - lastMs)/1000);
  lastMs = ms;
  if (playing) t += dt * speed;
  render();
  requestAnimationFrame(tick);
}

/* ------------------------------ panel ------------------------------ */
const panel = document.getElementById('panel');
const inputs = {}, readouts = {};

CTRL.forEach(sec => {
  const s = document.createElement('div'); s.className = 'sect';
  s.innerHTML = `<h2>${sec.g}</h2>`;
  sec.items.forEach(it => {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML =
      `<label for="c_${it.k}">${it.n}</label><span class="val" id="v_${it.k}"></span>` +
      `<input type="range" id="c_${it.k}" min="${it.min}" max="${it.max}" step="${it.step}" value="${it.v}">`;
    s.appendChild(row);
    const inp = row.querySelector('input'), out = row.querySelector('.val');
    inputs[it.k] = inp; readouts[it.k] = {el:out, it};
    const show = () => out.textContent = P[it.k].toFixed(it.f) + (it.u || '');
    inp.addEventListener('input', () => { P[it.k] = parseFloat(inp.value); show(); });
    // drag the number to scrub
    out.addEventListener('pointerdown', ev => {
      ev.preventDefault(); out.setPointerCapture(ev.pointerId);
      const x0 = ev.clientX, v0 = P[it.k], span = it.max - it.min;
      const move = m => {
        const v = Math.min(it.max, Math.max(it.min, v0 + (m.clientX - x0)/220 * span));
        P[it.k] = Math.round(v/it.step)*it.step; inp.value = P[it.k]; show();
      };
      const up = () => { out.removeEventListener('pointermove',move); out.removeEventListener('pointerup',up); };
      out.addEventListener('pointermove', move); out.addEventListener('pointerup', up);
    });
    show();
  });
  panel.appendChild(s);
});

function syncUI(){
  for (const k in inputs){ inputs[k].value = P[k];
    const {el,it} = readouts[k]; el.textContent = P[k].toFixed(it.f) + (it.u||''); }
}
function applyPreset(name){ Object.assign(P, PRESETS[name]); syncUI(); }

/* presets */
const ps = document.createElement('div'); ps.className='sect';
ps.innerHTML = `<h2>Presets</h2><div class="btns" id="presetBtns"></div>`;
panel.appendChild(ps);
Object.keys(PRESETS).forEach(name => {
  const b = document.createElement('button'); b.textContent = name;
  b.onclick = () => applyPreset(name);
  ps.querySelector('#presetBtns').appendChild(b);
});
const rnd = document.createElement('button'); rnd.textContent='Randomize';
rnd.onclick = () => {
  CTRL.forEach(s => { if (s.g === 'Motion') return;
    s.items.forEach(it => {
      if (it.k === 'count') { P.count = 8 + Math.floor(Math.random()*40); return; }
      P[it.k] = it.min + Math.random()*(it.max-it.min);
    });
  });
  P.depthInner = Math.max(P.depthOuter + .08, P.depthInner);
  P.weight = .4 + Math.random()*1.8;
  syncUI();
};
ps.querySelector('#presetBtns').appendChild(rnd);

/* transport */
const tr = document.createElement('div'); tr.className='sect';
tr.innerHTML = `<h2>Transport</h2>
  <div class="btns">
    <button id="play" class="on wide">Pause</button>
    <button data-sp=".25">.25×</button><button data-sp="1" class="on">1×</button><button data-sp="3">3×</button>
    <button id="reset" class="wide">Reset time</button>
  </div>
  <p class="hint"><kbd>space</kbd> play / pause · <kbd>R</kbd> randomize · drag any number to scrub</p>`;
panel.appendChild(tr);
const playBtn = tr.querySelector('#play');
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing?'Pause':'Play';
  playBtn.classList.toggle('on', playing); document.getElementById('hudState').textContent = playing?'playing':'paused'; };
tr.querySelector('#reset').onclick = () => { t = 0; };
tr.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => {
  speed = parseFloat(b.dataset.sp);
  tr.querySelectorAll('[data-sp]').forEach(x => x.classList.toggle('on', x===b));
});

/* output */
const out = document.createElement('div'); out.className='sect';
out.innerHTML = `<h2>Output</h2>
  <div class="swatches" style="margin-bottom:10px">
    <span class="sw"><input type="color" id="bgc" value="#000000">Ground</span>
    <span class="sw"><input type="color" id="inkc" value="#ffffff">Ink</span>
    <button id="invert">Invert</button>
  </div>
  <div class="btns">
    <button id="dlsvg" class="wide">Download SVG</button>
    <button id="dlpng" class="wide">Download PNG</button>
    <button id="dlanim" class="wide">SVG + spin loop</button>
    <button id="cpjson" class="wide">Copy params</button>
  </div>
  <p class="hint">Exported SVG keeps 4 lobe groups (<code>#lobe0…3</code>) so each arm can be
  animated separately. Set Bloom to 0 for a pure-vector file — bloom is a blur filter and
  rasterizes on import.<br><br>
  Note: lighting is baked per stroke at export. The spin-loop export rotates the whole mark,
  so the highlights turn with it rather than staying fixed the way they do here.</p>`;
panel.appendChild(out);

const bgc = out.querySelector('#bgc'), inkc = out.querySelector('#inkc');
bgc.oninput = e => bgColor = e.target.value;
inkc.oninput = e => inkColor = e.target.value;
out.querySelector('#invert').onclick = () => {
  const a = bgColor; bgColor = inkColor; inkColor = a;
  bgc.value = bgColor; inkc.value = inkColor;
};

function svgString(spin){
  render(); // guarantee the exported frame matches the current params
  const clone = stage.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  clone.setAttribute('xmlns:xlink','http://www.w3.org/1999/xlink');
  clone.setAttribute('width','1000'); clone.setAttribute('height','1000');
  if (spin){
    const dur = Math.abs(P.spin) > .01 ? (360/Math.abs(P.spin)) : 20;
    const dir = P.spin < 0 ? '-360' : '360';
    const wrapG = clone.ownerDocument.createElementNS('http://www.w3.org/2000/svg','g');
    const anim = clone.ownerDocument.createElementNS('http://www.w3.org/2000/svg','animateTransform');
    anim.setAttribute('attributeName','transform'); anim.setAttribute('type','rotate');
    anim.setAttribute('from','0 0 0'); anim.setAttribute('to',`${dir} 0 0`);
    anim.setAttribute('dur', dur.toFixed(2)+'s'); anim.setAttribute('repeatCount','indefinite');
    const lines = clone.querySelector('#lines'), glow = clone.querySelector('#glow');
    wrapG.appendChild(anim);
    if (glow) wrapG.appendChild(glow);
    wrapG.appendChild(lines);
    clone.appendChild(wrapG);
  }
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
}
function download(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
out.querySelector('#dlsvg').onclick  = () => download('star-ribbon.svg', new Blob([svgString(false)],{type:'image/svg+xml'}));
out.querySelector('#dlanim').onclick = () => download('star-ribbon-spin.svg', new Blob([svgString(true)],{type:'image/svg+xml'}));
out.querySelector('#dlpng').onclick  = () => {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 2000;
    const g = c.getContext('2d'); g.drawImage(img,0,0,2000,2000);
    c.toBlob(b => download('star-ribbon.png', b));
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString(false))));
};
out.querySelector('#cpjson').onclick = e => {
  navigator.clipboard.writeText(JSON.stringify(Object.assign({}, P, {bg:bgColor, ink:inkColor}), null, 2));
  e.target.textContent = 'Copied'; setTimeout(()=>e.target.textContent='Copy params', 1100);
};

addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  if (ev.code === 'Space'){ ev.preventDefault(); playBtn.click(); }
  if (ev.key === 'r' || ev.key === 'R') rnd.click();
});

build(Math.round(P.count));
requestAnimationFrame(tick);
</script>
</body>
</html>
